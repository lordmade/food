<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06C167">
    <title>Menu | Vynix Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface2: #f1f3f5;
            --border: #e9ecef;
            --text: #1a1d23;
            --dim: #6c757d;
            --accent: #06C167;
            --accent-dark: #05a357;
            --yellow: #ffc107;
            --danger: #ff3b30;
            --heart: #ff2d55;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --header-height: 70px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            touch-action: manipulation;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Shimmer Loading */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .shimmer-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 5000;
            display: none;
            flex-direction: column;
        }

        .shimmer-overlay.active {
            display: flex;
        }

        .shimmer-header {
            padding: 12px 16px;
            height: var(--header-height);
            background: var(--surface);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shimmer-back-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
        }

        .shimmer-store-name {
            width: 200px;
            height: 28px;
            border-radius: 6px;
        }

        .shimmer-content {
            padding: 20px 16px;
            flex: 1;
        }

        .shimmer-category {
            width: 120px;
            height: 32px;
            border-radius: 100px;
            margin-bottom: 16px;
        }

        .shimmer-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 12px;
        }

        .shimmer-item-image {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .shimmer-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shimmer-item-title {
            height: 20px;
            width: 70%;
            border-radius: 4px;
        }

        .shimmer-item-desc {
            height: 16px;
            width: 90%;
            border-radius: 4px;
        }

        .shimmer-item-price {
            height: 20px;
            width: 60px;
            border-radius: 4px;
            margin-top: auto;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            background: var(--surface);
            box-shadow: var(--shadow);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            height: var(--header-height);
            gap: 12px;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            transition: var(--transition);
        }

        .back-btn:active {
            background: var(--border);
            transform: scale(0.95);
        }

        .back-btn i {
            width: 24px;
            height: 24px;
        }

        .store-info {
            flex: 1;
            min-width: 0;
        }

        .store-name {
            font-weight: 800;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .store-meta {
            font-size: 0.85rem;
            color: var(--dim);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            position: relative;
            transition: var(--transition);
        }

        .icon-btn:active {
            transform: scale(0.95);
            background: var(--border);
        }

        .icon-btn i {
            width: 22px;
            height: 22px;
        }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            border: 2px solid var(--surface);
        }

        /* Store Banner */
        .store-banner {
            position: relative;
            height: 200px;
            background: linear-gradient(135deg, var(--surface2) 0%, var(--border) 100%);
            overflow: hidden;
        }

        .store-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .store-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 50%);
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .store-details {
            color: white;
            width: 100%;
        }

        .store-title-large {
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .store-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .store-tag {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Category Navigation */
        .category-nav {
            position: sticky;
            top: var(--header-height);
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 12px 0;
        }

        .category-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 16px;
            scroll-padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .category-btn {
            flex: 0 0 auto;
            padding: 10px 20px;
            border-radius: 100px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dim);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .category-btn.active {
            background: var(--text);
            color: white;
            border-color: var(--text);
        }

        .category-btn:active {
            transform: scale(0.96);
        }

        /* Menu Content */
        .menu-content {
            padding: 20px 16px 120px;
        }

        .menu-section {
            margin-bottom: 32px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }

        .section-title {
            font-weight: 800;
            font-size: 1.3rem;
        }

        .section-count {
            background: var(--surface2);
            color: var(--dim);
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Menu Items */
        .menu-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            gap: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
        }

        .menu-item:active {
            transform: scale(0.98);
            border-color: var(--accent);
        }

        .menu-item-image {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            flex-shrink: 0;
            background: var(--surface2);
        }

        .menu-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .menu-item-name {
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.3;
            flex: 1;
        }

        .menu-item-price {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--accent);
            white-space: nowrap;
        }

        .menu-item-description {
            color: var(--dim);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-item-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .item-tag {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .tag-veg {
            background: rgba(6, 193, 103, 0.1);
            color: var(--accent);
        }

        .tag-spicy {
            background: rgba(255, 59, 48, 0.1);
            color: var(--danger);
        }

        .tag-popular {
            background: rgba(255, 193, 7, 0.1);
            color: #b38600;
        }

        .add-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(6, 193, 103, 0.3);
        }

        .add-btn:active {
            transform: scale(0.9);
            background: var(--accent-dark);
        }

        .add-btn i {
            width: 20px;
            height: 20px;
        }

        /* Quantity Controls */
        .quantity-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            border-radius: 20px;
            padding: 4px;
            box-shadow: 0 4px 12px rgba(6, 193, 103, 0.3);
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .qty-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .qty-btn i {
            width: 16px;
            height: 16px;
        }

        .qty-value {
            color: white;
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        /* Sticky Cart Bar */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--text);
            color: white;
            padding: 16px 20px;
            padding-bottom: calc(16px + var(--safe-bottom));
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            z-index: 2000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
        }

        .cart-bar.active {
            display: flex;
        }

        .cart-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cart-count {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .cart-total {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .cart-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-btn:active {
            transform: scale(0.98);
            background: var(--accent-dark);
        }

        /* Item Detail Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 3000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: block;
            opacity: 1;
        }

        .item-modal {
            position: fixed;
            display: none;
            background: var(--surface);
            z-index: 3001;
            flex-direction: column;
            max-height: 85vh;
        }

        .item-modal.active {
            display: flex;
        }

        @media (max-width: 767px) {
            .item-modal {
                left: 0;
                right: 0;
                bottom: 0;
                border-radius: var(--radius) var(--radius) 0 0;
                transform: translateY(100%);
                transition: transform 0.3s ease;
            }

            .item-modal.active {
                transform: translateY(0);
            }
        }

        @media (min-width: 768px) {
            .item-modal {
                top: 50%;
                left: 50%;
                width: 100%;
                max-width: 600px;
                max-height: 80vh;
                border-radius: var(--radius);
                transform: translate(-50%, -50%) scale(0.95);
                opacity: 0;
                transition: all 0.3s ease;
            }

            .item-modal.active {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .modal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .modal-content {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 12px;
        }

        .modal-title {
            font-weight: 800;
            font-size: 1.4rem;
            flex: 1;
        }

        .modal-price {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--accent);
        }

        .modal-description {
            color: var(--dim);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Customization Options */
        .customization-section {
            margin-bottom: 24px;
        }

        .customization-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .required-badge {
            font-size: 0.75rem;
            color: var(--danger);
            font-weight: 600;
        }

        .option-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 2px solid transparent;
        }

        .option-item:active {
            background: var(--border);
        }

        .option-item.selected {
            border-color: var(--accent);
            background: rgba(6, 193, 103, 0.05);
        }

        .option-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .option-item.selected .option-radio {
            border-color: var(--accent);
            background: var(--accent);
        }

        .option-radio i {
            width: 12px;
            height: 12px;
            color: white;
            display: none;
        }

        .option-item.selected .option-radio i {
            display: block;
        }

        .option-name {
            font-weight: 600;
        }

        .option-price {
            font-weight: 700;
            color: var(--dim);
        }

        /* Modal Footer */
        .modal-footer {
            padding: 20px 24px;
            padding-bottom: calc(20px + var(--safe-bottom));
            border-top: 1px solid var(--border);
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .modal-quantity {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface2);
            padding: 8px;
            border-radius: 12px;
        }

        .modal-add-btn {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .modal-add-btn:active {
            transform: scale(0.98);
            background: var(--accent-dark);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: calc(100px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            background: var(--text);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 4000;
            transition: transform 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 90vw;
            text-align: center;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Desktop Styles */
        @media (min-width: 768px) {
            :root {
                --header-height: 80px;
            }

            .header {
                padding: 16px 32px;
            }

            .store-banner {
                height: 300px;
            }

            .menu-content {
                padding: 32px;
                padding-bottom: 140px;
                max-width: 800px;
                margin: 0 auto;
            }

            .category-nav {
                top: var(--header-height);
            }

            .category-scroll {
                padding: 4px 32px;
                max-width: 800px;
                margin: 0 auto;
            }

            .shimmer-header {
                padding: 16px 32px;
            }

            .shimmer-content {
                padding: 32px;
                max-width: 800px;
                margin: 0 auto;
            }
        }

        /* Empty State */
        .empty-menu {
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }

        .empty-menu i {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-menu p {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }
    </style>
</head>
<body>

    <!-- Shimmer Loading Overlay -->
    <div class="shimmer-overlay" id="shimmerOverlay">
        <div class="shimmer-header">
            <div class="shimmer shimmer-back-btn"></div>
            <div class="shimmer shimmer-store-name"></div>
        </div>
        <div class="shimmer-content">
            <div class="shimmer shimmer-category"></div>
            <div class="shimmer-item">
                <div class="shimmer shimmer-item-image"></div>
                <div class="shimmer-item-content">
                    <div class="shimmer shimmer-item-title"></div>
                    <div class="shimmer shimmer-item-desc"></div>
                    <div class="shimmer shimmer-item-price"></div>
                </div>
            </div>
            <div class="shimmer-item">
                <div class="shimmer shimmer-item-image"></div>
                <div class="shimmer-item-content">
                    <div class="shimmer shimmer-item-title"></div>
                    <div class="shimmer shimmer-item-desc"></div>
                    <div class="shimmer shimmer-item-price"></div>
                </div>
            </div>
            <div class="shimmer-item">
                <div class="shimmer shimmer-item-image"></div>
                <div class="shimmer-item-content">
                    <div class="shimmer shimmer-item-title"></div>
                    <div class="shimmer shimmer-item-desc"></div>
                    <div class="shimmer shimmer-item-price"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Added to cart</div>

    <!-- Header -->
    <header class="header">
        <button class="back-btn" onclick="goBack()" aria-label="Go back">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="store-info">
            <div class="store-name" id="storeName">Loading...</div>
            <div class="store-meta" id="storeMeta">
                <span id="storeCuisine">Various</span> • <span id="storeRating">★ 4.5</span> • <span id="storeTime">20-35 min</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleCart()" aria-label="Cart">
                <i data-lucide="shopping-bag"></i>
                <span class="badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Store Banner -->
    <div class="store-banner" id="storeBanner">
        <div class="store-overlay">
            <div class="store-details">
                <div class="store-title-large" id="storeTitleLarge">Store Name</div>
                <div class="store-tags">
                    <span class="store-tag" id="deliveryFee">R 20 delivery</span>
                    <span class="store-tag" id="minOrder">Min R 50</span>
                    <span class="store-tag" id="storeDistance">2.5 km away</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Category Navigation -->
    <nav class="category-nav" id="categoryNav" style="display: none;">
        <div class="category-scroll no-scrollbar" id="categoryScroll">
            <!-- Categories injected here -->
        </div>
    </nav>

    <!-- Menu Content -->
    <main class="menu-content" id="menuContent">
        <div class="empty-menu" id="emptyMenu" style="display: none;">
            <i data-lucide="utensils"></i>
            <p>No menu items available</p>
            <p style="font-size: 0.9rem;">This store hasn't added their menu yet.</p>
        </div>
        <!-- Menu sections injected here -->
    </main>

    <!-- Sticky Cart Bar -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-info">
            <div class="cart-count" id="cartCountText">0 items</div>
            <div class="cart-total" id="cartTotalText">R 0.00</div>
        </div>
        <button class="cart-btn" onclick="viewCart()">
            View Cart
            <i data-lucide="arrow-right"></i>
        </button>
    </div>

    <!-- Item Detail Modal -->
    <div class="modal-overlay" id="itemModalOverlay" onclick="closeItemModal()"></div>
    <div class="item-modal" id="itemModal">
        <img class="modal-image" id="modalImage" src="" alt="">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Item Name</h2>
                <span class="modal-price" id="modalPrice">R 0.00</span>
            </div>
            <p class="modal-description" id="modalDescription">Description</p>
            
            <!-- Customizations -->
            <div class="customization-section" id="customizationSection">
                <div class="customization-title">
                    <span>Customize</span>
                    <span class="required-badge">Optional</span>
                </div>
                <div class="option-list" id="optionList">
                    <!-- Options injected here -->
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <div class="modal-quantity">
                <button class="qty-btn" onclick="changeModalQty(-1)">
                    <i data-lucide="minus"></i>
                </button>
                <span class="qty-value" id="modalQty">1</span>
                <button class="qty-btn" onclick="changeModalQty(1)">
                    <i data-lucide="plus"></i>
                </button>
            </div>
            <button class="modal-add-btn" onclick="addToCartFromModal()">
                Add to Cart
                <span id="modalTotalPrice">R 0.00</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Get vendor ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('id') || sessionStorage.getItem('currentVendorId');

        if (!vendorId) {
            window.location.href = '/';
            return;
        }

        // Store vendor ID for persistence
        sessionStorage.setItem('currentVendorId', vendorId);

        // State
        let vendorData = null;
        let menuData = {};
        let cart = JSON.parse(sessionStorage.getItem('cart') || '[]');
        let currentItem = null;
        let modalQuantity = 1;
        let selectedOptions = {};

        // Show/Hide shimmer
        function showShimmer() {
            document.getElementById('shimmerOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideShimmer() {
            document.getElementById('shimmerOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load vendor data
        async function loadVendorData() {
            showShimmer();
            
            try {
                const snapshot = await get(ref(db, `vendors/${vendorId}`));
                
                if (!snapshot.exists()) {
                    showToast('Store not found');
                    setTimeout(() => window.location.href = '/', 2000);
                    return;
                }

                vendorData = snapshot.val();
                
                // Update UI
                document.getElementById('storeName').textContent = vendorData.name || 'Unnamed Store';
                document.getElementById('storeTitleLarge').textContent = vendorData.name || 'Unnamed Store';
                document.getElementById('storeCuisine').textContent = vendorData.cuisine || 'Various';
                document.getElementById('storeRating').textContent = `★ ${vendorData.rating || '4.5'}`;
                document.getElementById('storeTime').textContent = vendorData.deliveryTime || '20-35 min';
                document.getElementById('deliveryFee').textContent = `R ${vendorData.deliveryFee || 20} delivery`;
                document.getElementById('minOrder').textContent = `Min R ${vendorData.minOrder || 50}`;
                
                // Set banner image if available
                if (vendorData.imageURL || vendorData.image) {
                    document.getElementById('storeBanner').style.background = `url(${vendorData.imageURL || vendorData.image}) center/cover`;
                }

                // Load menu
                await loadMenu();
                
                setTimeout(hideShimmer, 500);
            } catch (error) {
                console.error('Error loading vendor:', error);
                showToast('Error loading store');
                hideShimmer();
            }
        }

        // Load menu data
        async function loadMenu() {
            try {
                const menuSnapshot = await get(ref(db, `menus/${vendorId}`));
                
                if (!menuSnapshot.exists()) {
                    document.getElementById('emptyMenu').style.display = 'block';
                    document.getElementById('categoryNav').style.display = 'none';
                    return;
                }

                menuData = menuSnapshot.val();
                renderMenu();
            } catch (error) {
                console.error('Error loading menu:', error);
                document.getElementById('emptyMenu').style.display = 'block';
            }
        }

        // Render menu with categories
        function renderMenu() {
            const menuContent = document.getElementById('menuContent');
            const categoryScroll = document.getElementById('categoryScroll');
            
            menuContent.innerHTML = '';
            categoryScroll.innerHTML = '';

            // Get categories (or create default)
            const categories = Object.keys(menuData).filter(key => key !== 'metadata');
            
            if (categories.length === 0) {
                document.getElementById('emptyMenu').style.display = 'block';
                return;
            }

            document.getElementById('categoryNav').style.display = 'block';

            // Render category buttons
            categories.forEach((category, index) => {
                const btn = document.createElement('button');
                btn.className = `category-btn ${index === 0 ? 'active' : ''}`;
                btn.textContent = formatCategoryName(category);
                btn.onclick = () => scrollToCategory(category, btn);
                categoryScroll.appendChild(btn);
            });

            // Render menu sections
            categories.forEach(category => {
                const section = document.createElement('div');
                section.className = 'menu-section';
                section.id = `section-${category}`;
                
                const items = menuData[category];
                if (!items || Object.keys(items).length === 0) return;

                const itemCount = Object.keys(items).length;

                section.innerHTML = `
                    <div class="section-header">
                        <h2 class="section-title">${formatCategoryName(category)}</h2>
                        <span class="section-count">${itemCount} items</span>
                    </div>
                `;

                const itemsContainer = document.createElement('div');
                
                Object.entries(items).forEach(([itemId, item]) => {
                    const itemEl = createMenuItem(itemId, item, category);
                    itemsContainer.appendChild(itemEl);
                });

                section.appendChild(itemsContainer);
                menuContent.appendChild(section);
            });

            updateCartUI();
            lucide.createIcons();
        }

        // Create menu item element
        function createMenuItem(itemId, item, category) {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.onclick = () => openItemModal(itemId, item, category);

            const inCart = getCartQuantity(itemId);
            const tags = [];

            if (item.vegetarian) tags.push('<span class="item-tag tag-veg">🌿 Veg</span>');
            if (item.spicy) tags.push('<span class="item-tag tag-spicy">🌶️ Spicy</span>');
            if (item.popular) tags.push('<span class="item-tag tag-popular">⭐ Popular</span>');

            div.innerHTML = `
                <img class="menu-item-image" src="${item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'}" alt="${item.name}" loading="lazy">
                <div class="menu-item-content">
                    <div class="menu-item-header">
                        <div class="menu-item-name">${item.name}</div>
                        <div class="menu-item-price">R ${item.price}</div>
                    </div>
                    <div class="menu-item-description">${item.description || 'No description available'}</div>
                    <div class="menu-item-tags">
                        ${tags.join('')}
                    </div>
                </div>
                ${inCart > 0 ? `
                    <div class="quantity-controls" onclick="event.stopPropagation()">
                        <button class="qty-btn" onclick="updateCart('${itemId}', '${category}', -1)">
                            <i data-lucide="minus"></i>
                        </button>
                        <span class="qty-value">${inCart}</span>
                        <button class="qty-btn" onclick="updateCart('${itemId}', '${category}', 1)">
                            <i data-lucide="plus"></i>
                        </button>
                    </div>
                ` : `
                    <button class="add-btn" onclick="event.stopPropagation(); quickAdd('${itemId}', '${category}')">
                        <i data-lucide="plus"></i>
                    </button>
                `}
            `;

            return div;
        }

        // Format category name
        function formatCategoryName(name) {
            return name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        }

        // Scroll to category
        function scrollToCategory(category, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const section = document.getElementById(`section-${category}`);
            if (section) {
                const offset = 140; // Header + category nav height
                const top = section.offsetTop - offset;
                window.scrollTo({ top, behavior: 'smooth' });
            }
        }

        // Open item detail modal
        window.openItemModal = function(itemId, item, category) {
            currentItem = { id: itemId, ...item, category };
            modalQuantity = 1;
            selectedOptions = {};

            document.getElementById('modalImage').src = item.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600';
            document.getElementById('modalTitle').textContent = item.name;
            document.getElementById('modalPrice').textContent = `R ${item.price}`;
            document.getElementById('modalDescription').textContent = item.description || 'No description available';
            document.getElementById('modalQty').textContent = '1';
            
            updateModalTotal();

            // Render customization options if available
            const optionList = document.getElementById('optionList');
            optionList.innerHTML = '';
            
            if (item.options && Array.isArray(item.options)) {
                document.getElementById('customizationSection').style.display = 'block';
                item.options.forEach((option, idx) => {
                    const optDiv = document.createElement('div');
                    optDiv.className = 'option-item';
                    optDiv.onclick = () => selectOption(idx, option.price || 0);
                    optDiv.innerHTML = `
                        <div class="option-left">
                            <div class="option-radio">
                                <i data-lucide="check"></i>
                            </div>
                            <span class="option-name">${option.name}</span>
                        </div>
                        <span class="option-price">${option.price ? '+R ' + option.price : 'Free'}</span>
                    `;
                    optionList.appendChild(optDiv);
                });
            } else {
                document.getElementById('customizationSection').style.display = 'none';
            }

            document.getElementById('itemModalOverlay').classList.add('active');
            document.getElementById('itemModal').classList.add('active');
            lucide.createIcons();
        };

        // Close item modal
        window.closeItemModal = function() {
            document.getElementById('itemModalOverlay').classList.remove('active');
            document.getElementById('itemModal').classList.remove('active');
        };

        // Select option in modal
        function selectOption(index, price) {
            const options = document.querySelectorAll('.option-item');
            options.forEach((opt, idx) => {
                opt.classList.toggle('selected', idx === index);
            });
            selectedOptions = { index, price };
            updateModalTotal();
        }

        // Change quantity in modal
        window.changeModalQty = function(delta) {
            modalQuantity = Math.max(1, modalQuantity + delta);
            document.getElementById('modalQty').textContent = modalQuantity;
            updateModalTotal();
        };

        // Update modal total price
        function updateModalTotal() {
            if (!currentItem) return;
            const basePrice = currentItem.price;
            const optionPrice = selectedOptions.price || 0;
            const total = (basePrice + optionPrice) * modalQuantity;
            document.getElementById('modalTotalPrice').textContent = `R ${total.toFixed(2)}`;
        }

        // Add to cart from modal
        window.addToCartFromModal = function() {
            if (!currentItem) return;

            const cartItem = {
                id: currentItem.id,
                name: currentItem.name,
                price: currentItem.price + (selectedOptions.price || 0),
                quantity: modalQuantity,
                category: currentItem.category,
                vendorId: vendorId,
                vendorName: vendorData.name,
                options: selectedOptions.index !== undefined ? [currentItem.options[selectedOptions.index]] : [],
                image: currentItem.image
            };

            addItemToCart(cartItem);
            closeItemModal();
            showToast(`Added ${modalQuantity} ${currentItem.name} to cart`);
        };

        // Quick add (from menu item)
        window.quickAdd = function(itemId, category) {
            const item = menuData[category][itemId];
            const cartItem = {
                id: itemId,
                name: item.name,
                price: item.price,
                quantity: 1,
                category: category,
                vendorId: vendorId,
                vendorName: vendorData.name,
                options: [],
                image: item.image
            };
            addItemToCart(cartItem);
            showToast(`Added ${item.name} to cart`);
        };

        // Update cart quantity
        window.updateCart = function(itemId, category, delta) {
            const existingIndex = cart.findIndex(item => item.id === itemId && item.vendorId === vendorId);
            
            if (existingIndex >= 0) {
                cart[existingIndex].quantity += delta;
                if (cart[existingIndex].quantity <= 0) {
                    cart.splice(existingIndex, 1);
                }
            } else if (delta > 0) {
                const item = menuData[category][itemId];
                cart.push({
                    id: itemId,
                    name: item.name,
                    price: item.price,
                    quantity: 1,
                    category: category,
                    vendorId: vendorId,
                    vendorName: vendorData.name,
                    options: [],
                    image: item.image
                });
            }

            saveCart();
            renderMenu(); // Re-render to update quantity controls
            updateCartUI();
        };

        // Add item to cart helper
        function addItemToCart(cartItem) {
            const existingIndex = cart.findIndex(item => 
                item.id === cartItem.id && 
                item.vendorId === cartItem.vendorId &&
                JSON.stringify(item.options) === JSON.stringify(cartItem.options)
            );

            if (existingIndex >= 0) {
                cart[existingIndex].quantity += cartItem.quantity;
            } else {
                cart.push(cartItem);
            }

            saveCart();
            renderMenu();
            updateCartUI();
        }

        // Get quantity of item in cart
        function getCartQuantity(itemId) {
            const item = cart.find(item => item.id === itemId && item.vendorId === vendorId);
            return item ? item.quantity : 0;
        }

        // Save cart to sessionStorage
        function saveCart() {
            sessionStorage.setItem('cart', JSON.stringify(cart));
        }

        // Update cart UI
        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            // Update badge
            const badge = document.getElementById('cartBadge');
            badge.textContent = totalItems;
            badge.style.display = totalItems > 0 ? 'flex' : 'none';

            // Update cart bar
            const cartBar = document.getElementById('cartBar');
            if (totalItems > 0) {
                cartBar.classList.add('active');
                document.getElementById('cartCountText').textContent = `${totalItems} item${totalItems > 1 ? 's' : ''}`;
                document.getElementById('cartTotalText').textContent = `R ${totalPrice.toFixed(2)}`;
            } else {
                cartBar.classList.remove('active');
            }
        }

        // View cart
        window.viewCart = function() {
            window.location.href = '/cart.html';
        };

        // Toggle cart drawer (simplified for this page)
        window.toggleCart = function() {
            if (cart.length === 0) {
                showToast('Your cart is empty');
                return;
            }
            viewCart();
        };

        // Go back
        window.goBack = function() {
            window.history.back();
        };

        // Show toast
        window.showToast = function(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        // Initialize
        lucide.createIcons();
        loadVendorData();

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeItemModal();
            }
        });
    </script>
</body>
</html>
