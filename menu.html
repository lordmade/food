<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Vynix Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --border: #e9ecef;
            --text: #1a1d23;
            --dim: #6c757d;
            --accent: #06C167;
            --yellow: #ffc107;
            --radius: 24px;
            --shadow: 0 10px 30px rgba(0,0,0,0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }

        /* NAVIGATION */
        .nav-bar { position: fixed; top: 0; width: 100%; padding: 20px 5%; display: flex; justify-content: space-between; z-index: 1000; }
        .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; box-shadow: var(--shadow); transition: var(--transition); color: var(--text); }
        .icon-btn:hover { transform: scale(1.05); background: white; }

        /* HERO SECTION */
        .hero { height: 35vh; min-height: 250px; background: #ddd; position: relative; }
        .hero img { width: 100%; height: 100%; object-fit: cover; }
        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%); }

        /* VENDOR INFO CARD */
        .vendor-info { max-width: 900px; margin: -60px auto 0; background: var(--surface); border-radius: var(--radius); padding: 30px; position: relative; z-index: 10; box-shadow: var(--shadow); border: 1px solid var(--border); width: 90%; }
        .v-name { font-size: 2rem; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .v-meta { color: var(--dim); font-size: 1rem; font-weight: 500; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .v-rating { background: var(--surface); padding: 6px 12px; border-radius: 100px; font-weight: 700; border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }

        /* MENU GRID */
        .menu-container { max-width: 900px; margin: 40px auto 80px; width: 90%; }
        .category-title { font-size: 1.4rem; font-weight: 800; margin: 40px 0 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        
        /* MENU ITEM CARD */
        .m-card { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; gap: 16px; border: 1px solid var(--border); transition: var(--transition); cursor: pointer; }
        .m-card:hover { border-color: var(--accent); box-shadow: 0 5px 20px rgba(0,0,0,0.05); transform: translateY(-2px); }
        .m-content { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .m-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
        .m-desc { color: var(--dim); font-size: 0.85rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 12px; }
        .m-price { font-weight: 800; font-size: 1.1rem; color: var(--text); }
        .m-img { width: 110px; height: 110px; border-radius: 12px; object-fit: cover; background: var(--border); }
        
        .add-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); color: var(--accent); position: absolute; bottom: 16px; right: 16px; }
        .m-card { position: relative; } /* Needed for absolute add-btn */
        .m-card:hover .add-btn { background: var(--accent); color: white; border-color: var(--accent); }

        /* LOADER */
        #loader { text-align: center; padding: 100px 0; color: var(--dim); font-weight: 600; }
        
        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: 1fr; }
            .v-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <button class="icon-btn" onclick="window.location.href='index.html'"><i data-lucide="arrow-left"></i></button>
        <button class="icon-btn"><i data-lucide="search"></i></button>
    </nav>

    <div id="loader">Loading menu...</div>

    <div id="vendorContent" style="display: none;">
        <div class="hero">
            <img id="vendorBanner" src="" alt="Vendor Banner">
            <div class="hero-overlay"></div>
        </div>

        <div class="vendor-info">
            <h1 class="v-name" id="vendorName">Vendor Name</h1>
            <div class="v-meta">
                <span class="v-rating"><span style="color: var(--yellow);">★</span> <span id="vendorRating">0.0</span></span>
                <span id="vendorTags">Tags</span>
                <span>•</span>
                <span id="vendorDelivery">R0.00 Delivery</span>
            </div>
        </div>

        <div class="menu-container" id="menuContainer">
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. EXTRACT ID FROM URL
        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('id');

        if (!vendorId) {
            window.location.href = 'index.html'; // Kick them back if no ID is present
        }

        async function loadVendorAndMenu() {
            try {
                // 2. FETCH VENDOR DETAILS & MENU IN PARALLEL
                const vendorRef = ref(db, `vendors/${vendorId}`);
                // Assuming you store menus in a separate node keyed by vendorId for database performance
                const menuRef = ref(db, `menus/${vendorId}`); 

                const [vendorSnap, menuSnap] = await Promise.all([
                    get(vendorRef),
                    get(menuRef)
                ]);

                if (!vendorSnap.exists()) {
                    alert("Store not found");
                    window.location.href = 'index.html';
                    return;
                }

                const vendor = vendorSnap.val();
                const menuData = menuSnap.val() || {};

                // 3. POPULATE UI
                document.getElementById('vendorBanner').src = vendor.bannerURL || vendor.imageURL || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1200';
                document.getElementById('vendorName').textContent = vendor.name;
                document.getElementById('vendorRating').textContent = vendor.rating || 'New';
                document.getElementById('vendorTags').textContent = vendor.cuisine || vendor.storeType || 'Various';
                document.getElementById('vendorDelivery').textContent = `R${vendor.deliveryFee || 20} Delivery`;

                renderMenu(menuData);

                document.getElementById('loader').style.display = 'none';
                document.getElementById('vendorContent').style.display = 'block';

            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('loader').textContent = "Failed to load menu. Please try again.";
            }
        }

        function renderMenu(menuData) {
            const container = document.getElementById('menuContainer');
            
            if (Object.keys(menuData).length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--dim); margin-top: 40px;">No items available right now.</p>';
                return;
            }

            // Assuming menuData is structured by category: { "Burgers": { item1: {...}, item2: {...} }, "Drinks": {...} }
            // If your DB is structured as a flat list, you will need to group them by category via JS first.
            
            let html = '';

            for (const [category, items] of Object.entries(menuData)) {
                html += `<h2 class="category-title">${category}</h2>`;
                html += `<div class="menu-grid">`;

                for (const [itemId, item] of Object.entries(items)) {
                    html += `
                        <div class="m-card" onclick="openItemModal('${itemId}')">
                            <div class="m-content">
                                <div>
                                    <h3 class="m-name">${item.name}</h3>
                                    <p class="m-desc">${item.description || ''}</p>
                                </div>
                                <span class="m-price">R ${parseFloat(item.price).toFixed(2)}</span>
                            </div>
                            ${item.imageURL ? `<img src="${item.imageURL}" alt="${item.name}" class="m-img">` : ''}
                            <button class="add-btn" onclick="addToCart(event, '${itemId}', '${item.name}', ${item.price})">
                                <i data-lucide="plus"></i>
                            </button>
                        </div>
                    `;
                }
                
                html += `</div>`;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Placeholder functions for cart logic
        window.openItemModal = (itemId) => {
            console.log("Open details for:", itemId);
            // Logic to open a modal for item customizations (extra cheese, etc.)
        };

        window.addToCart = (event, itemId, name, price) => {
            event.stopPropagation(); // Prevents the card click event from firing
            console.log("Added to cart:", name, price);
            // Cart array logic will go here
        };

        lucide.createIcons();
        loadVendorAndMenu();
    </script>
</body>
</html>
