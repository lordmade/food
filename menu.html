<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06C167">
    <title>Menu | Vynix Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f5f5f5;
            --surface: #ffffff;
            --surface2: #f1f3f5;
            --border: #e9ecef;
            --border-light: #f0f0f0;
            --text: #1a1d23;
            --text-secondary: #4a4a4a;
            --dim: #6c757d;
            --accent: #06C167;
            --accent-dark: #05a357;
            --accent-light: #e8f8ef;
            --yellow: #ffc107;
            --danger: #ff3b30;
            --heart: #ff2d55;
            --radius: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-height: 64px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --shimmer-base: #f0f0f0;
            --shimmer-highlight: #e8e8e8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            touch-action: manipulation;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ============================================
           SHIMMER LOADING EFFECT
           ============================================ */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, 
                var(--shimmer-base) 25%, 
                var(--shimmer-highlight) 50%, 
                var(--shimmer-base) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .shimmer-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 5000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .shimmer-overlay.active {
            display: flex;
        }

        .shimmer-header {
            padding: 12px 16px;
            background: var(--surface);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }

        .shimmer-back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .shimmer-title {
            width: 150px;
            height: 22px;
            border-radius: 6px;
        }

        .shimmer-header-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .shimmer-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .shimmer-restaurant-info {
            padding: 0;
            background: var(--surface);
            margin-bottom: 8px;
        }

        .shimmer-restaurant-image {
            width: 100%;
            height: 200px;
        }

        .shimmer-restaurant-name {
            width: 70%;
            height: 26px;
            border-radius: 6px;
            margin: 16px 16px 12px;
        }

        .shimmer-restaurant-meta {
            width: 50%;
            height: 16px;
            border-radius: 4px;
            margin: 0 16px 8px;
        }

        .shimmer-categories {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            background: var(--surface);
            margin-bottom: 8px;
        }

        .shimmer-category-btn {
            width: 90px;
            height: 36px;
            border-radius: 100px;
            flex-shrink: 0;
        }

        .shimmer-content {
            padding: 16px;
            flex: 1;
        }

        .shimmer-section-title {
            width: 120px;
            height: 22px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .shimmer-menu-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border-light);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .shimmer-list-item {
            display: flex;
            background: var(--surface);
            padding: 16px;
            gap: 12px;
        }

        .shimmer-list-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shimmer-list-item-title {
            height: 18px;
            width: 70%;
            border-radius: 4px;
        }

        .shimmer-list-item-desc {
            height: 14px;
            width: 100%;
            border-radius: 4px;
        }

        .shimmer-list-item-desc2 {
            height: 14px;
            width: 60%;
            border-radius: 4px;
        }

        .shimmer-list-item-price {
            height: 18px;
            width: 50px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .shimmer-list-item-image {
            width: 110px;
            height: 110px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        /* ============================================
           APP STYLES
           ============================================ */

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            height: var(--header-height);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-light);
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .back-btn:active {
            background: var(--surface2);
            transform: scale(0.92);
        }

        .back-btn i {
            width: 24px;
            height: 24px;
        }

        .header-title {
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--text);
            position: relative;
            transition: var(--transition);
        }

        .action-btn:active {
            transform: scale(0.92);
            background: var(--surface2);
        }

        .action-btn i {
            width: 22px;
            height: 22px;
        }

        .cart-badge {
            position: absolute;
            top: 2px;
            right: 0px;
            background: var(--accent);
            color: white;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
            border: 2px solid var(--surface);
            line-height: 1.3;
        }

        /* Restaurant Hero */
        .restaurant-hero {
            background: var(--surface);
            margin-bottom: 8px;
            position: relative;
        }

        .restaurant-banner-wrap {
            position: relative;
            width: 100%;
            height: 200px;
            overflow: hidden;
        }

        .restaurant-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .restaurant-banner-gradient {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: linear-gradient(transparent, rgba(0,0,0,0.4));
        }

        .restaurant-info-section {
            padding: 16px;
        }

        .restaurant-name {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .restaurant-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--dim);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .restaurant-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restaurant-meta .meta-dot {
            width: 3px;
            height: 3px;
            background: var(--dim);
            border-radius: 50%;
        }

        .restaurant-meta i {
            width: 14px;
            height: 14px;
        }

        .rating-star {
            color: var(--yellow);
        }

        .delivery-info-bar {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            margin-top: 4px;
        }

        .delivery-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            flex: 1;
        }

        .delivery-info-item .info-value {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }

        .delivery-info-item .info-label {
            font-size: 0.75rem;
            color: var(--dim);
            font-weight: 500;
        }

        .restaurant-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .tag {
            padding: 4px 10px;
            background: var(--surface2);
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--dim);
        }

        /* Search Bar */
        .search-section {
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
        }

        .search-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }

        .search-input-wrap:focus-within {
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(6, 193, 103, 0.1);
        }

        .search-input-wrap i {
            width: 18px;
            height: 18px;
            color: var(--dim);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--dim);
        }

        /* Category Tabs */
        .category-tabs {
            background: var(--surface);
            padding: 0;
            position: sticky;
            top: var(--header-height);
            z-index: 100;
            border-bottom: 1px solid var(--border-light);
        }

        .tabs-scroll {
            display: flex;
            gap: 0;
            overflow-x: auto;
            padding: 0 16px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex: 0 0 auto;
            padding: 14px 16px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--dim);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            touch-action: manipulation;
            position: relative;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-btn:active {
            opacity: 0.7;
        }

        /* Menu Content */
        .menu-content {
            padding: 0 0 120px;
            flex: 1;
        }

        .menu-section {
            margin-bottom: 8px;
            background: var(--surface);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px 4px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            text-transform: capitalize;
            letter-spacing: -0.01em;
        }

        .section-count {
            font-size: 0.8rem;
            color: var(--dim);
            font-weight: 500;
        }

        /* ============================================
           ZULZI-STYLE MENU LIST ITEMS
           ============================================ */
        .menu-list {
            display: flex;
            flex-direction: column;
        }

        .menu-list-item {
            display: flex;
            gap: 14px;
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .menu-list-item:last-child {
            border-bottom: none;
        }

        .menu-list-item:active {
            background: var(--surface2);
        }

        .menu-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            justify-content: space-between;
            padding: 2px 0;
        }

        .menu-item-top {
            flex: 1;
        }

        .menu-item-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-item-desc {
            color: var(--dim);
            font-size: 0.82rem;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .menu-item-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .menu-item-tag {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 100px;
            background: var(--surface2);
            color: var(--dim);
        }

        .menu-item-tag.featured {
            background: #fff3cd;
            color: #856404;
        }

        .menu-item-tag.calories {
            background: #fce4ec;
            color: #c62828;
        }

        .menu-item-tag.prep {
            background: #e3f2fd;
            color: #1565c0;
        }

        .menu-item-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .menu-item-price {
            font-weight: 800;
            font-size: 1rem;
            color: var(--text);
            letter-spacing: -0.01em;
        }

        .menu-item-price .currency {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .menu-item-add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            transition: var(--transition);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(6, 193, 103, 0.3);
        }

        .menu-item-add-btn:active {
            transform: scale(0.9);
            background: var(--accent-dark);
        }

        .menu-item-add-btn i {
            width: 20px;
            height: 20px;
        }

        /* Item quantity badge on add button */
        .menu-item-qty-control {
            display: flex;
            align-items: center;
            gap: 2px;
            background: var(--accent);
            border-radius: 100px;
            padding: 2px;
            box-shadow: 0 2px 8px rgba(6, 193, 103, 0.3);
        }

        .menu-item-qty-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: white;
            cursor: pointer;
            border-radius: 50%;
            transition: var(--transition);
        }

        .menu-item-qty-btn:active {
            background: rgba(255,255,255,0.2);
        }

        .menu-item-qty-btn i {
            width: 16px;
            height: 16px;
        }

        .menu-item-qty-value {
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            min-width: 20px;
            text-align: center;
        }

        /* Image Container */
        .menu-item-image-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            flex-shrink: 0;
            background: var(--surface2);
        }

        .menu-item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .menu-list-item:hover .menu-item-image {
            transform: scale(1.05);
        }

        .menu-item-badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .menu-item-no-image {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
        }

        .menu-item-no-image i {
            width: 32px;
            height: 32px;
            color: var(--border);
        }

        /* Overlay for cart drawer */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .cart-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        /* Empty State */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }

        .empty-state.active {
            display: block;
        }

        .empty-state i {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state p:first-of-type {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            background: var(--text);
            color: white;
            padding: 12px 24px;
            border-radius: 100px;
            z-index: 4000;
            transition: transform 0.3s ease;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 90vw;
            text-align: center;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Floating Cart Bar */
        .floating-cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1500;
            padding: 12px 16px;
            padding-bottom: calc(12px + var(--safe-bottom));
            background: transparent;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: translateY(100%);
            opacity: 0;
        }

        .floating-cart-bar.visible {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .floating-cart-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--accent);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(6, 193, 103, 0.4);
            cursor: pointer;
            transition: var(--transition);
        }

        .floating-cart-inner:active {
            transform: scale(0.98);
        }

        .floating-cart-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .floating-cart-count {
            background: rgba(255,255,255,0.25);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
        }

        .floating-cart-label {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .floating-cart-total {
            font-weight: 800;
            font-size: 1.05rem;
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: var(--bg);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .cart-header {
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-weight: 800;
            font-size: 1.15rem;
        }

        .close-cart-btn {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--dim);
            transition: var(--transition);
        }

        .close-cart-btn:active {
            background: var(--border);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: var(--surface);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            border: 1px solid var(--border-light);
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-weight: 700;
            font-size: 0.9rem;

            width: 48px;
            height: 48px;
            margin-bottom: 12px;

        /* Desktop */
        @media (min-width: 768px) {
            .header {
                padding: 8px 32px;

            .restaurant-info-section {
                padding: 20px 32px;

                height: 130px;

            .floating-cart-bar {
                padding: 16px 32px;

            }

            .cart-drawer {
                max-width: 420px;
                border-left: 1px solid var(--border);
            }
        }

        @media (min-width: 1024px) {
            .menu-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 0;
            }

            .menu-list-item {
                border-right: 1px solid var(--border-light);
            }

            .menu-list-item:nth-child(2n) {
                border-right: none;
            }
        }

        /* Animation for add to cart */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .pop-in {
            animation: popIn 0.25s ease forwards;

        @keyframes addPulse {
            0% { box-shadow: 0 0 0 0 rgba(6, 193, 103, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(6, 193, 103, 0); }
            100% { box-shadow: 0 0 0 0 rgba(6, 193, 103, 0); }
        }

        .add-pulse {
            animation: addPulse 0.4s ease;
        }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('vendor');

        if (!vendorId) {
            showToast("No restaurant selected");
            setTimeout(() => window.location.href = 'index.html', 2000);
        }

        let cart = [];
        let currentUser = null;
        let currentUserId = null;
        let menuData = {};
        let currentCategory = 'all';
        let allMenuItems = [];
        let categories = new Set(['all']);
        let vendorInfo = null;
        let searchQuery = '';

        function showShimmer() {
            document.getElementById('shimmerOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideShimmer() {
            document.getElementById('shimmerOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        async function loadMenu() {
            showShimmer();
            try {
                const vendorSnapshot = await get(ref(db, `vendors/${vendorId}`));
                if (vendorSnapshot.exists()) {
                    vendorInfo = vendorSnapshot.val();
                    displayVendorInfo(vendorInfo);
                } else {
                    showToast("Restaurant not found");
                    setTimeout(() => window.location.href = 'index.html', 2000);
                    return;
                }

                const menuSnapshot = await get(ref(db, `vendors/${vendorId}/menu`));
                if (menuSnapshot.exists()) {
                    menuData = menuSnapshot.val();
                    processAndDisplayMenu(menuData);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error("Error loading menu:", error);
                showToast("Failed to load menu");
                showEmptyState();
            } finally {
                setTimeout(hideShimmer, 600);
            }
        }

        function displayVendorInfo(vendor) {
            document.getElementById('headerTitle').textContent = vendor.name || 'Menu';
            document.getElementById('restaurantName').textContent = vendor.name || 'Unnamed';
            document.getElementById('restaurantImage').src = vendor.imageURL || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';
            document.getElementById('restaurantRating').textContent = vendor.rating || '4.5';
            document.getElementById('restaurantTime').textContent = vendor.deliveryTime || '20-35 min';
            document.getElementById('restaurantDelivery').textContent = vendor.deliveryFee || '20';
            document.getElementById('restaurantMinOrder').textContent = vendor.minOrder ? `R${vendor.minOrder}` : 'R0';

            const cuisineType = [vendor.cuisineCategory, vendor.cuisine].filter(Boolean).join(' · ');
            document.getElementById('restaurantCuisineType').textContent = cuisineType || 'Restaurant';

            const tagsContainer = document.getElementById('restaurantTags');
            const tags = [vendor.storeType, vendor.cuisine, vendor.cuisineCategory].filter(Boolean);
            const uniqueTags = [...new Set(tags)];
            tagsContainer.innerHTML = uniqueTags.map(tag => `<span class="tag">${tag}</span>`).join('');

            document.getElementById('restaurantHero').style.display = 'block';
            lucide.createIcons();
        }

        function processAndDisplayMenu(data) {
            allMenuItems = [];
            categories = new Set(['all']);

            if (!data || typeof data !== 'object') {
                showEmptyState();
                return;
            }

            Object.entries(data).forEach(([itemId, item]) => {
                if (item && item.name && item.status === 'available') {
                    const category = item.category || 'Other';
                    categories.add(category);

                    allMenuItems.push({
                        id: itemId,
                        name: item.name,
                        category: category,
                        price: parseFloat(item.price) || 0,
                        description: item.description || '',
                        imageURL: item.imageURL || '',
                        calories: item.calories || '',
                        prepTime: item.prepTime || '',
                        allergens: item.allergens || '',
                        status: item.status || 'available',
                        featured: item.featured || false
                    });
                }
            });

            if (allMenuItems.length === 0) {
                showEmptyState();
                return;
            }

            // Sort: featured first
            allMenuItems.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));

            const categoryArray = Array.from(categories);
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = categoryArray.map(cat => {
                const count = cat === 'all' ? allMenuItems.length : allMenuItems.filter(i => i.category === cat).length;
                return `<button class="tab-btn ${cat === 'all' ? 'active' : ''}" onclick="filterCategory('${cat.replace(/'/g, "\\'")}', this)">${cat === 'all' ? 'All' : cat}</button>`;
            }).join('');
            document.getElementById('categoryTabs').style.display = 'block';

            renderMenuItems(allMenuItems);
        }

        function getItemCartQuantity(itemId) {
            const item = cart.find(c => c.itemId === itemId);
            return item ? item.quantity : 0;
        }

        function renderMenuItems(items) {
            const container = document.getElementById('menuContainer');
            const noResults = document.getElementById('noResults');

            if (items.length === 0) {
                container.innerHTML = '';
                noResults.classList.add('active');
                return;
            }

            noResults.classList.remove('active');

            // Group by category
            const grouped = items.reduce((acc, item) => {
                const cat = item.category || 'Other';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([category, categoryItems]) => `
                <div class="menu-section" id="section-${category.replace(/\s+/g, '-')}">
                    <div class="section-header">
                        <h3 class="section-title">${category}</h3>
                        <span class="section-count">${categoryItems.length} item${categoryItems.length > 1 ? 's' : ''}</span>
                    </div>
                    <div class="menu-list">
                        ${categoryItems.map(item => {
                            const qty = getItemCartQuantity(item.id);
                            return `
                            <div class="menu-list-item" id="menu-item-${item.id}">
                                <div class="menu-item-info">
                                    <div class="menu-item-top">
                                        <h4 class="menu-item-name">${item.name}</h4>
                                        <p class="menu-item-desc">${item.description || 'Delicious item prepared fresh'}</p>
                                        <div class="menu-item-tags">
                                            ${item.featured ? '<span class="menu-item-tag featured">⭐ Popular</span>' : ''}
                                            ${item.calories ? `<span class="menu-item-tag calories">${item.calories} kcal</span>` : ''}
                                            ${item.prepTime ? `<span class="menu-item-tag prep">${item.prepTime} min</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="menu-item-bottom">
                                        <span class="menu-item-price"><span class="currency">R</span>${item.price.toFixed(2)}</span>
                                        <div id="add-control-${item.id}">
                                            ${qty > 0 ? `
                                                <div class="menu-item-qty-control pop-in">
                                                    <button class="menu-item-qty-btn" onclick="event.stopPropagation(); changeItemQty('${item.id}', -1)">
                                                        <i data-lucide="minus"></i>
                                                    </button>
                                                    <span class="menu-item-qty-value">${qty}</span>
                                                    <button class="menu-item-qty-btn" onclick="event.stopPropagation(); changeItemQty('${item.id}', 1)">
                                                        <i data-lucide="plus"></i>
                                                    </button>
                                                </div>
                                            ` : `
                                                <button class="menu-item-add-btn" onclick="event.stopPropagation(); addToCart('${item.id}', '${item.name.replace(/'/g, "\\'")}', ${item.price}, ${item.prepTime || 0})" aria-label="Add ${item.name}">
                                                    <i data-lucide="plus"></i>
                                                </button>
                                            `}
                                        </div>
                                    </div>
                                </div>
                                <div class="menu-item-image-wrap">
                                    ${item.imageURL ? `
                                        <img class="menu-item-image" src="${item.imageURL}" alt="${item.name}" loading="lazy">
                                    ` : `
                                        <div class="menu-item-no-image">
                                            <i data-lucide="image"></i>
                                        </div>
                                    `}
                                    ${item.featured ? '<span class="menu-item-badge">Popular</span>' : ''}
                                </div>
                            </div>
                        `}).join('')}
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function refreshMenuItemControl(itemId) {
            const controlEl = document.getElementById(`add-control-${itemId}`);
            if (!controlEl) return;

            const qty = getItemCartQuantity(itemId);
            const item = allMenuItems.find(i => i.id === itemId);
            if (!item) return;

            if (qty > 0) {
                controlEl.innerHTML = `
                    <div class="menu-item-qty-control pop-in">
                        <button class="menu-item-qty-btn" onclick="event.stopPropagation(); changeItemQty('${item.id}', -1)">
                            <i data-lucide="minus"></i>
                        </button>
                        <span class="menu-item-qty-value">${qty}</span>
                        <button class="menu-item-qty-btn" onclick="event.stopPropagation(); changeItemQty('${item.id}', 1)">
                            <i data-lucide="plus"></i>
                        </button>
                    </div>
                `;
            } else {
                controlEl.innerHTML = `
                    <button class="menu-item-add-btn" onclick="event.stopPropagation(); addToCart('${item.id}', '${item.name.replace(/'/g, "\\'")}', ${item.price}, ${item.prepTime || 0})" aria-label="Add ${item.name}">
                        <i data-lucide="plus"></i>
                    </button>
                `;
            }
            lucide.createIcons();
        }

        function showEmptyState() {
            document.getElementById('emptyState').classList.add('active');
            document.getElementById('categoryTabs').style.display = 'none';
        }

        window.filterCategory = (category, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;

            let items = allMenuItems;
            if (category !== 'all') {
                items = allMenuItems.filter(item => item.category === category);
            }
            if (searchQuery) {
                items = items.filter(item =>
                    item.name.toLowerCase().includes(searchQuery) ||
                    (item.description && item.description.toLowerCase().includes(searchQuery))
                );
            }
            renderMenuItems(items);
        };

        window.handleSearch = (value) => {
            searchQuery = value.toLowerCase().trim();
            let items = allMenuItems;

            if (currentCategory !== 'all') {
                items = items.filter(item => item.category === currentCategory);
            }
            if (searchQuery) {
                items = items.filter(item =>
                    item.name.toLowerCase().includes(searchQuery) ||
                    (item.description && item.description.toLowerCase().includes(searchQuery))
                );
            }
            renderMenuItems(items);
        };

        window.toggleSearch = () => {
            const section = document.getElementById('searchSection');
            const isVisible = section.style.display !== 'none';
            section.style.display = isVisible ? 'none' : 'block';
            if (!isVisible) {
                setTimeout(() => document.getElementById('searchInput').focus(), 100);
            } else {
                document.getElementById('searchInput').value = '';
                searchQuery = '';
                handleSearch('');
            }
            lucide.createIcons();
        };

        window.goBack = () => {
            window.location.href = 'index.html';
        };

        function calculateAveragePrepTime() {
            if (cart.length === 0) return 0;
            const totalPrepTime = cart.reduce((sum, item) => sum + (item.prepTime || 0), 0);
            return Math.ceil(totalPrepTime / cart.length);
        }

        function getVendorAveragePrepTime() {
            if (vendorInfo && vendorInfo.avgPrepTime) {
                return parseInt(vendorInfo.avgPrepTime) || 0;
            }
            if (allMenuItems.length > 0) {
                const times = allMenuItems.map(item => parseInt(item.prepTime) || 0).filter(t => t > 0);
                if (times.length > 0) {
                    return Math.ceil(times.reduce((a, b) => a + b, 0) / times.length);
                }
            }
            return 0;
        }

        window.addToCart = async (itemId, name, price, prepTime = 0) => {
            const existingItem = cart.find(item => item.itemId === itemId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    itemId,
                    name,
                    price,
                    prepTime: parseInt(prepTime) || 0,
                    quantity: 1,
                    vendorId,
                    addedAt: Date.now()
                });
            }

            if (currentUserId) {
                await saveCartToFirebase();
            }

            refreshMenuItemControl(itemId);
            updateCartUI();
            showToast(`${name} added to cart`);
        };

        window.changeItemQty = async (itemId, delta) => {
            const existingItem = cart.find(item => item.itemId === itemId);
            if (!existingItem) return;

            existingItem.quantity += delta;
            if (existingItem.quantity <= 0) {
                cart = cart.filter(item => item.itemId !== itemId);
            }

            if (currentUserId) {
                await saveCartToFirebase();
            }

            refreshMenuItemControl(itemId);
            updateCartUI();
        };

        async function saveCartToFirebase() {
            if (!currentUserId) return;
            try {
                await set(ref(db, `carts/${currentUserId}`), {
                    items: cart,
                    vendorId: vendorId,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error("Error saving cart:", error);
            }
        }

        async function loadCartFromFirebase() {
            if (!currentUserId) return;
            try {
                const snapshot = await get(ref(db, `carts/${currentUserId}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if (data.vendorId === vendorId && data.items) {
                        cart = data.items;
                        updateCartUI();
                        // Re-render to show quantities
                        const filtered = currentCategory === 'all' ? allMenuItems : allMenuItems.filter(i => i.category === currentCategory);
                        renderMenuItems(filtered);
                    }
                }
            } catch (error) {
                console.error("Error loading cart:", error);
            }
        }

        window.updateCartItemQuantity = async (index, newQuantity) => {
            const itemId = cart[index]?.itemId;
            if (newQuantity < 1) {
                cart.splice(index, 1);
            } else {
                cart[index].quantity = newQuantity;
            }

            if (currentUserId) {
                await saveCartToFirebase();
            }
            if (itemId) refreshMenuItemControl(itemId);
            updateCartUI();
        };

        window.removeFromCart = async (index) => {
            const itemId = cart[index]?.itemId;
            cart.splice(index, 1);
            if (currentUserId) {
                await saveCartToFirebase();
            }
            if (itemId) refreshMenuItemControl(itemId);
            updateCartUI();
        };

        function updateCartUI() {
            const body = document.getElementById('cartBody');
            const countEl = document.getElementById('cartCount');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const summaryEl = document.getElementById('cartSummary');
            const cartFooter = document.getElementById('cartFooter');
            const floatingBar = document.getElementById('floatingCartBar');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const deliveryFee = parseFloat(vendorInfo?.deliveryFee || 0);
            const total = subtotal + deliveryFee;

            // Cart badge
            if (totalItems > 0) {
                countEl.style.display = 'block';
                countEl.textContent = totalItems;
            } else {
                countEl.style.display = 'none';
            }

            checkoutBtn.disabled = cart.length === 0;

            // Floating cart bar
            if (totalItems > 0) {
                floatingBar.classList.add('visible');
                document.getElementById('floatingCartCount').textContent = totalItems;
                document.getElementById('floatingCartTotal').textContent = `R ${total.toFixed(2)}`;
            } else {
                floatingBar.classList.remove('visible');
            }

            const avgPrepTime = calculateAveragePrepTime();
            const vendorAvgPrep = getVendorAveragePrepTime();
            const displayPrepTime = avgPrepTime > 0 ? avgPrepTime : vendorAvgPrep;

            if (cart.length === 0) {
                body.innerHTML = `
                    <div class="cart-empty-state">
                        <i data-lucide="shopping-bag"></i>
                        <p>Your cart is empty</p>
                        <small>Add items to get started</small>
                    </div>
                `;
                summaryEl.innerHTML = '';
                cartFooter.style.display = 'none';
            } else {
                cartFooter.style.display = 'block';
                body.innerHTML = cart.map((item, index) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">R${item.price.toFixed(2)} each</div>
                        </div>
                        <div class="cart-quantity-control">
                            <button class="cart-qty-btn" onclick="updateCartItemQuantity(${index}, ${item.quantity - 1})">
                                <i data-lucide="${item.quantity === 1 ? 'trash-2' : 'minus'}" style="width:14px;height:14px;${item.quantity === 1 ? 'color:var(--danger);' : ''}"></i>
                            </button>
                            <span class="cart-qty-value">${item.quantity}</span>
                            <button class="cart-qty-btn" onclick="updateCartItemQuantity(${index}, ${item.quantity + 1})">
                                <i data-lucide="plus" style="width:14px;height:14px;"></i>
                            </button>
                        </div>
                        <div class="cart-item-total">R${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                `).join('');

                const prepTimeHtml = displayPrepTime > 0
                    ? `<div class="prep-time-badge"><i data-lucide="clock" style="width:14px;height:14px;"></i> Est. prep: ~${displayPrepTime} min</div>`
                    : '';

                summaryEl.innerHTML = `
                    ${prepTimeHtml}
                    <div class="cart-summary">
                        <div class="cart-summary-row">
                            <span>Subtotal (${totalItems} item${totalItems > 1 ? 's' : ''})</span>
                            <span>R ${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Delivery fee</span>
                            <span>${deliveryFee > 0 ? `R ${deliveryFee.toFixed(2)}` : 'Free'}</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Total</span>
                            <span>R ${total.toFixed(2)}</span>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        window.toggleCart = () => {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            const isOpen = drawer.classList.contains('open');

            if (isOpen) {
                drawer.classList.remove('open');
                overlay.classList.remove('open');
                document.body.style.overflow = '';
            } else {
                drawer.classList.add('open');
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        };

        window.handleCheckout = async () => {
            if (!currentUser) {
                showToast("Please sign in to checkout");
                return;
            }

            if (cart.length === 0) {
                showToast("Your cart is empty");
                return;
            }

            try {
                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const deliveryFee = parseFloat(vendorInfo?.deliveryFee || 0);

                const orderData = {
                    userId: currentUserId,
                    vendorId: vendorId,
                    vendorName: vendorInfo?.name || '',
                    items: cart,
                    subtotal: subtotal,
                    deliveryFee: deliveryFee,
                    total: subtotal + deliveryFee,
                    status: 'pending',
                    createdAt: Date.now(),
                    estimatedPrepTime: calculateAveragePrepTime() || getVendorAveragePrepTime()
                };

                const newOrderRef = push(ref(db, 'orders'));
                await set(newOrderRef, orderData);

                cart = [];
                await saveCartToFirebase();
                updateCartUI();
                toggleCart();

                // Re-render menu to clear quantities
                const filtered = currentCategory === 'all' ? allMenuItems : allMenuItems.filter(i => i.category === currentCategory);
                renderMenuItems(filtered);

                showToast("Order placed successfully! 🎉");
            } catch (error) {
                console.error("Checkout error:", error);
                showToast("Failed to place order");
            }
        };

        window.showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                currentUserId = user.uid;
                loadCartFromFirebase();
            } else {
                currentUserId = null;
                cart = [];
                updateCartUI();
            }
        });

        lucide.createIcons();
        loadMenu();
    </script>
</body>
</html>
