<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu | Vynix Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg: #f4f7f6;
            --surface: #ffffff;
            --surface2: #f1f3f5;
            --border: #e9ecef;
            --text: #1a1d23;
            --dim: #6c757d;
            --accent: #06C167;
            --accent-dark: #05a357;
            --accent-light: #e6f9ed;
            --radius: 20px;
            --shadow: 0 4px 16px rgba(0,0,0,0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--dim); }
        .sidebar {
            width: 280px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            padding: 24px 20px;
            position: fixed;
            height: 100vh;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }
        .sidebar.expanded { width: 280px; }
        .nav-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
        .logo {
            font-weight: 800; font-size: 1.5rem; margin-bottom: 36px;
            color: var(--text); letter-spacing: -1px;
            display: flex; align-items: center; gap: 12px;
            white-space: nowrap; overflow: hidden;
        }
        .logo .logo-icon { flex-shrink: 0; width: 28px; height: 28px; color: var(--accent); }
        .logo .logo-text { opacity: 0; transform: translateX(-10px); transition: opacity 0.25s ease, transform 0.25s ease; }
        .sidebar.expanded .logo .logo-text { opacity: 1; transform: translateX(0); }
        .logo-text span { color: var(--accent); }
        .nav-section { margin-bottom: 24px; }
        .nav-label {
            font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--dim); margin-bottom: 10px; padding-left: 12px; font-weight: 700;
            white-space: nowrap; opacity: 0; transition: opacity 0.2s ease;
        }
        .sidebar.expanded .nav-label { opacity: 1; }
        .nav-item {
            padding: 13px 12px; margin-bottom: 4px; border-radius: 14px;
            cursor: pointer; transition: var(--transition); font-weight: 600;
            display: flex; align-items: center; gap: 12px; color: var(--dim);
            white-space: nowrap; position: relative;
        }
        .nav-item:hover { background: var(--surface2); color: var(--text); }
        .nav-item.active { background: var(--accent); color: white; }
        .nav-icon { flex-shrink: 0; width: 20px; height: 20px; }
        .nav-text { opacity: 0; transform: translateX(-8px); transition: opacity 0.2s ease, transform 0.2s ease; }
        .sidebar.expanded .nav-text { opacity: 1; transform: translateX(0); }
        .main-panel {
            margin-left: 280px;
            flex: 1;
            padding: 36px;
            max-width: calc(100% - 280px);
            transition: margin-left 0.35s cubic-bezier(0.4,0,0.2,1), max-width 0.35s cubic-bezier(0.4,0,0.2,1);
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .search-bar {
            padding: 11px 18px;
            border: 1.5px solid var(--border);
            border-radius: 999px !important;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
            background: var(--bg);
            color: var(--text);
            width: 280px;
        }
        .search-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(6,193,103,0.12);
            background: white;
        }
        .content-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }
        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-header h2 {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .menu-item-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: var(--transition);
            position: relative;
        }
        .menu-item-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }
        .menu-item-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: var(--surface2);
        }
        .menu-item-img-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, var(--accent-light), var(--bg));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
        }
        .menu-item-body {
            padding: 16px;
        }
        .menu-item-name {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 6px;
        }
        .menu-item-desc {
            color: var(--dim);
            font-size: 0.85rem;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .menu-item-price {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .menu-item-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: var(--transition);
        }
        .menu-item-card:hover .menu-item-actions {
            opacity: 1;
        }
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .icon-btn-edit {
            background: white;
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .icon-btn-edit:hover {
            background: var(--text);
            color: white;
        }
        .icon-btn-delete {
            background: white;
            color: var(--danger);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .icon-btn-delete:hover {
            background: var(--danger);
            color: white;
        }
        .empty-state {
            text-align: center;
            padding: 56px 24px;
            color: var(--dim);
        }
        .empty-state svg {
            opacity: 0.4;
            margin-bottom: 14px;
        }
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text);
            color: white;
            padding: 15px 22px;
            border-radius: 999px;
            box-shadow: var(--shadow-hover);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
            z-index: 3000;
            font-size: 0.9rem;
            font-weight: 600;
            max-width: 360px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.success {
            border-left: 4px solid var(--accent);
        }
        .toast.error {
            border-left: 4px solid var(--danger);
        }
        .toast.info {
            border-left: 4px solid var(--purple);
        }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-panel { margin-left: 0; padding: 20px; }
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <nav class="sidebar" id="sidebar">
        <div class="logo">
            <i data-lucide="utensils" class="logo-icon"></i>
            <span class="logo-text">VYNIX<span>EATS</span></span>
        </div>
        <div class="nav-scroll">
            <div class="nav-section">
                <div class="nav-label">Menu</div>
                <div class="nav-item active" onclick="filterMenu('all')">
                    <i data-lucide="list" class="nav-icon"></i>
                    <span class="nav-text">All Items</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Starters')">
                    <i data-lucide="chef-hat" class="nav-icon"></i>
                    <span class="nav-text">Starters</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Mains')">
                    <i data-lucide="dinner" class="nav-icon"></i>
                    <span class="nav-text">Mains</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Burgers')">
                    <i data-lucide="burger" class="nav-icon"></i>
                    <span class="nav-text">Burgers</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Pizza')">
                    <i data-lucide="pizza" class="nav-icon"></i>
                    <span class="nav-text">Pizza</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Salads')">
                    <i data-lucide="salad" class="nav-icon"></i>
                    <span class="nav-text">Salads</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Desserts')">
                    <i data-lucide="cake" class="nav-icon"></i>
                    <span class="nav-text">Desserts</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Drinks')">
                    <i data-lucide="wine" class="nav-icon"></i>
                    <span class="nav-text">Drinks</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Sides')">
                    <i data-lucide="utensils" class="nav-icon"></i>
                    <span class="nav-text">Sides</span>
                </div>
                <div class="nav-item" onclick="filterMenu('Specials')">
                    <i data-lucide="star" class="nav-icon"></i>
                    <span class="nav-text">Specials</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN PANEL -->
    <main class="main-panel" id="mainPanel">
        <div class="page-header">
            <h1>Shop Menu</h1>
            <input type="text" class="search-bar" id="searchInput" placeholder="Search menu items..." oninput="filterMenuBySearch()">
        </div>
        <div class="content-card">
            <div class="card-header">
                <h2><i data-lucide="book-open" style="width:18px;height:18px;"></i> Menu Items</h2>
            </div>
            <div id="menuGrid" class="menu-grid">
                <!-- Menu items will be loaded here -->
            </div>
        </div>
    </main>

    <!-- TOAST -->
    <div class="toast" id="toast">
        <i data-lucide="check-circle" style="width:18px;height:18px;"></i>
        <span id="toastMsg">Done</span>
    </div>

    <script>
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Global state
        let menuCache = {};
        let currentFilter = 'all';
        let currentSearch = '';

        // Load menu items from Firebase
        function loadMenu() {
            const vendorKey = localStorage.getItem('vynix_vendor_session');
            if (!vendorKey) {
                showToast('Vendor session not found. Please log in.', 'error');
                return;
            }
            const key = JSON.parse(vendorKey).key;
            db.ref(`vendors/${key}/menu`).on('value', snap => {
                menuCache = snap.val() || {};
                renderMenu();
            });
        }

        // Render menu items based on filter and search
        function renderMenu() {
            const items = Object.entries(menuCache);
            let filteredItems = items;

            // Apply category filter
            if (currentFilter !== 'all') {
                filteredItems = filteredItems.filter(([,v]) => v.category === currentFilter);
            }

            // Apply search filter
            if (currentSearch) {
                const searchTerm = currentSearch.toLowerCase();
                filteredItems = filteredItems.filter(([,v]) =>
                    (v.name || '').toLowerCase().includes(searchTerm) ||
                    (v.description || '').toLowerCase().includes(searchTerm)
                );
            }

            // Render items
            const grid = document.getElementById('menuGrid');
            if (!filteredItems.length) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1/-1;">
                        <i data-lucide="package" style="width:44px;height:44px;display:block;margin:0 auto 12px;opacity:.4;"></i>
                        <p style="font-weight:600;margin-bottom:4px;">No menu items found</p>
                        <p style="font-size:0.85rem;">Try adjusting your filters or search terms</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            grid.innerHTML = filteredItems.map(([key, v]) => {
                const imgEl = v.imageURL
                    ? `<img src="${v.imageURL}" class="menu-item-img" alt="${v.name}" loading="lazy">`
                    : `<div class="menu-item-img-placeholder"><i data-lucide="image" style="width:36px;height:36px;"></i></div>`;

                return `
                    <div class="menu-item-card">
                        <div style="position:relative;">
                            ${imgEl}
                            <div class="menu-item-actions">
                                <button class="icon-btn icon-btn-edit" onclick="editItem('${key}')">
                                    <i data-lucide="edit-2" style="width:13px;height:13px;"></i>
                                </button>
                            </div>
                        </div>
                        <div class="menu-item-body">
                            <div class="menu-item-name">${v.name || 'Unnamed Item'}</div>
                            <div style="font-size:0.72rem;color:var(--accent-dark);font-weight:600;margin-bottom:4px;">
                                ${v.category || ''}
                            </div>
                            <div class="menu-item-desc">${v.description || ''}</div>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                                <div class="menu-item-price">R ${Number(v.price || 0).toFixed(2)}</div>
                                ${v.prepTime ? `
                                    <div style="font-size:0.76rem;color:var(--dim);display:flex;align-items:center;gap:3px;">
                                        <i data-lucide="clock" style="width:12px;height:12px;"></i>
                                        ${v.prepTime} min
                                    </div>
                                ` : ''}
                            </div>
                            ${v.allergens ? `
                                <div style="margin-top:6px;font-size:0.72rem;color:var(--dim);">
                                    <span style="font-weight:700;">⚠ Allergens:</span> ${v.allergens}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        // Filter menu by category
        function filterMenu(category) {
            currentFilter = category;
            document.querySelectorAll('#sidebar .nav-item').forEach(item => item.classList.remove('active'));
            event.target.closest('.nav-item').classList.add('active');
            renderMenu();
        }

        // Filter menu by search
        function filterMenuBySearch() {
            currentSearch = document.getElementById('searchInput').value;
            renderMenu();
        }

        // Edit item (redirect to edit modal in main portal)
        function editItem(key) {
            localStorage.setItem('vynix_edit_item_key', key);
            window.location.href = 'vendor-portal.html#menu';
        }

        // Show toast
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.className = 'toast show ' + type;
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 3000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu();
            lucide.createIcons();
        });
    </script>
</body>
</html>
