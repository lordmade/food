<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06C167">
    <title>Menu | Vynix Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface2: #f1f3f5;
            --border: #e9ecef;
            --text: #1a1d23;
            --dim: #6c757d;
            --accent: #06C167;
            --accent-dark: #05a357;
            --yellow: #ffc107;
            --danger: #ff3b30;
            --heart: #ff2d55;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);

            /* Shimmer colors */
            --shimmer-base: #f0f0f0;
            --shimmer-highlight: #e8e8e8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            touch-action: manipulation;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ============================================
           SHIMMER LOADING EFFECT
           ============================================ */

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, 
                var(--shimmer-base) 25%, 
                var(--shimmer-highlight) 50%, 
                var(--shimmer-base) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Shimmer Overlay - Full Page */
        .shimmer-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 5000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .shimmer-overlay.active {
            display: flex;
        }

        /* Shimmer Header */
        .shimmer-header {
            padding: 12px 16px;
            background: var(--surface);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }

        .shimmer-back-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .shimmer-title {
            width: 150px;
            height: 24px;
            border-radius: 6px;
        }

        .shimmer-header-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .shimmer-action-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
        }

        /* Shimmer Restaurant Info */
        .shimmer-restaurant-info {
            padding: 20px 16px;
            background: var(--surface);
            margin-bottom: 12px;
        }

        .shimmer-restaurant-image {
            width: 100%;
            height: 200px;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .shimmer-restaurant-name {
            width: 70%;
            height: 28px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .shimmer-restaurant-meta {
            width: 50%;
            height: 18px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        /* Shimmer Category Tabs */
        .shimmer-categories {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            background: var(--surface);
            margin-bottom: 12px;
        }

        .shimmer-category-btn {
            width: 100px;
            height: 40px;
            border-radius: 100px;
            flex-shrink: 0;
        }

        /* Shimmer Menu Grid */
        .shimmer-content {
            padding: 20px 16px;
            flex: 1;
        }

        .shimmer-section-title {
            width: 120px;
            height: 24px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .shimmer-menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .shimmer-menu-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .shimmer-menu-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Shimmer Menu Card */
        .shimmer-menu-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .shimmer-menu-image {
            width: 100%;
            height: 140px;
        }

        .shimmer-menu-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shimmer-menu-title {
            height: 20px;
            width: 80%;
            border-radius: 4px;
        }

        .shimmer-menu-desc {
            height: 14px;
            width: 100%;
            border-radius: 4px;
        }

        .shimmer-menu-desc-short {
            height: 14px;
            width: 60%;
            border-radius: 4px;
        }

        .shimmer-menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .shimmer-menu-price {
            height: 18px;
            width: 50px;
            border-radius: 4px;
        }

        .shimmer-menu-btn {
            height: 32px;
            width: 60px;
            border-radius: 100px;
        }

        /* App Container */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            height: var(--header-height);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .back-btn:active {
            background: var(--border);
            transform: scale(0.95);
        }

        .back-btn i {
            width: 24px;
            height: 24px;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            position: relative;
            transition: var(--transition);
        }

        .action-btn:active {
            transform: scale(0.95);
            background: var(--border);
        }

        .action-btn i {
            width: 22px;
            height: 22px;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            border: 2px solid var(--surface);
        }

        /* Restaurant Info Section */
        .restaurant-hero {
            background: var(--surface);
            padding: 20px 16px;
            margin-bottom: 12px;
        }

        .restaurant-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .restaurant-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .restaurant-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--dim);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .restaurant-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restaurant-meta i {
            width: 16px;
            height: 16px;
        }

        .rating-star {
            color: var(--yellow);
        }

        .restaurant-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 12px;
            background: var(--surface2);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dim);
        }

        /* Category Tabs */
        .category-tabs {
            background: var(--surface);
            padding: 12px 0;
            position: sticky;
            top: var(--header-height);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .tabs-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 16px;
            scroll-padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 20px;
            border-radius: 100px;
            background: var(--surface2);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dim);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            min-height: 40px;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-btn:active {
            transform: scale(0.96);
        }

        /* Menu Content */
        .menu-content {
            padding: 20px 16px 100px;
            flex: 1;
        }

        .menu-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text);
            text-transform: capitalize;
        }

        /* Menu Grid - Column Layout */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        @media (min-width: 768px) {
            .menu-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .menu-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
        }

        /* Menu Item Card */
        .menu-card {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .menu-card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-lg);
        }

        .menu-card-image-wrap {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
        }

        .menu-card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .menu-card:hover .menu-card-image {
            transform: scale(1.05);
        }

        .menu-card-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--accent);
            color: white;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .menu-card-content {
            padding: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .menu-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .menu-card-name {
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.3;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-card-price {
            font-weight: 800;
            color: var(--accent);
            font-size: 1rem;
            white-space: nowrap;
        }

        .menu-card-desc {
            color: var(--dim);
            font-size: 0.8rem;
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .menu-card-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--dim);
            margin-bottom: 10px;
        }

        .menu-card-meta span {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .menu-card-footer {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .add-btn {
            flex: 1;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .add-btn:active {
            transform: scale(0.95);
            background: var(--accent-dark);
        }

        .add-btn i {
            width: 16px;
            height: 16px;
        }

        /* Empty State */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }

        .empty-state.active {
            display: block;
        }

        .empty-state i {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state p:first-of-type {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            background: var(--text);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 4000;
            transition: transform 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 90vw;
            text-align: center;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-weight: 800;
            font-size: 1.2rem;
        }

        .close-cart-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--dim);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .cart-summary {
            background: var(--surface2);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 16px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .cart-summary-row:last-child {
            margin-bottom: 0;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            font-weight: 700;
            font-size: 1.1rem;
        }

        .prep-time-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-light);
            color: var(--accent-dark);
            padding: 8px 12px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 56px;
        }

        .checkout-btn:active {
            transform: scale(0.98);
            background: var(--accent-dark);
        }

        .checkout-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* Quantity Controls */
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 4px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: none;
            background: var(--surface2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .qty-btn:active {
            background: var(--accent);
            color: white;
        }

        .qty-value {
            font-weight: 700;
            min-width: 24px;
            text-align: center;
        }

        /* Desktop Styles */
        @media (min-width: 768px) {
            :root {
                --header-height: 80px;
            }

            .shimmer-header,
            .header {
                padding: 16px 32px;
            }

            .shimmer-restaurant-info,
            .restaurant-hero {
                padding: 24px 32px;
            }

            .shimmer-categories,
            .category-tabs {
                padding-left: 32px;
                padding-right: 32px;
            }

            .shimmer-content,
            .menu-content {
                padding: 32px;
                padding-bottom: 32px;
            }

            .menu-card-image-wrap {
                height: 160px;
            }

            .cart-drawer {
                width: 400px;
            }
        }
    </style>
<base target="_blank">

                </div>
            </div>
        </div>
    </div>

    <div id="toast">Message</div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()" aria-label="Go back">
                    <i data-lucide="arrow-left"></i>
                </button>
                <h1 class="header-title" id="headerTitle">Menu</h1>
            </div>

            <div class="header-actions">
                <button class="action-btn" onclick="toggleCart()" aria-label="Cart">
                    <i data-lucide="shopping-bag"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
            </div>
        </header>

        <!-- Restaurant Info -->
        <div class="restaurant-hero" id="restaurantHero" style="display: none;">
            <img class="restaurant-image" id="restaurantImage" src="" alt="">
            <h2 class="restaurant-name" id="restaurantName"></h2>
            <div class="restaurant-meta">
                <span><i data-lucide="star" class="rating-star"></i> <span id="restaurantRating"></span></span>
                <span><i data-lucide="clock"></i> <span id="restaurantTime"></span></span>
                <span><i data-lucide="truck"></i> R<span id="restaurantDelivery"></span></span>
            </div>
            <div class="restaurant-tags" id="restaurantTags"></div>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs" style="display: none;">
            <div class="tabs-scroll no-scrollbar" id="tabsContainer">
                <button class="tab-btn active" onclick="filterCategory('all', this)">All Items</button>
            </div>
        </div>

        <!-- Menu Content -->
        <main class="menu-content">
            <div class="empty-state" id="emptyState">
                <i data-lucide="package-open"></i>
                <p>No menu items found.</p>
                <p style="font-size: 0.9rem;">This restaurant hasn't added any items yet.</p>
            </div>

            <div id="menuContainer"></div>
        </main>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart-btn" onclick="toggleCart()">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="cart-body" id="cartBody">
            <p style="text-align: center; color: var(--dim); margin-top: 80px;">Your cart is empty</p>
        </div>
        <div class="cart-footer">
            <div id="cartSummary"></div>
            <button class="checkout-btn" id="checkoutBtn" disabled onclick="handleCheckout()">Checkout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, get, set, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Get vendor ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('vendor');

        if (!vendorId) {
            showToast("No restaurant selected");
            setTimeout(() => window.location.href = 'index.html', 2000);
        }

        let cart = [];
        let currentUser = null;
        let currentUserId = null;
        let menuData = {};
        let currentCategory = 'all';
        let allMenuItems = [];
        let categories = new Set(['all']);
        let vendorInfo = null;
        let cartRef = null;

        // Show/Hide shimmer loading
        function showShimmer() {
            document.getElementById('shimmerOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideShimmer() {
            document.getElementById('shimmerOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load vendor data and menu from vendor panel structure
        async function loadMenu() {
            showShimmer();

            try {
                // Load vendor info from vendors/{vendorId}
                const vendorSnapshot = await get(ref(db, `vendors/${vendorId}`));
                if (vendorSnapshot.exists()) {
                    vendorInfo = vendorSnapshot.val();
                    displayVendorInfo(vendorInfo);
                } else {
                    showToast("Restaurant not found");
                    setTimeout(() => window.location.href = 'index.html', 2000);
                    return;
                }

                // Load menu from vendors/{vendorId}/menu (vendor panel structure)
                const menuSnapshot = await get(ref(db, `vendors/${vendorId}/menu`));
                if (menuSnapshot.exists()) {
                    menuData = menuSnapshot.val();
                    processAndDisplayMenu(menuData);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error("Error loading menu:", error);
                showToast("Failed to load menu");
                showEmptyState();
            } finally {
                setTimeout(hideShimmer, 500);
            }
        }

        function displayVendorInfo(vendor) {
            document.getElementById('headerTitle').textContent = vendor.name || 'Menu';
            document.getElementById('restaurantName').textContent = vendor.name || 'Unnamed';
            document.getElementById('restaurantImage').src = vendor.imageURL || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';
            document.getElementById('restaurantRating').textContent = vendor.rating || '4.5';
            document.getElementById('restaurantTime').textContent = vendor.deliveryTime || '20-35 min';
            document.getElementById('restaurantDelivery').textContent = vendor.deliveryFee || '20';

            // Tags
            const tagsContainer = document.getElementById('restaurantTags');
            const tags = [vendor.cuisineCategory, vendor.cuisine, vendor.storeType].filter(Boolean);
            tagsContainer.innerHTML = tags.map(tag => 
                `<span class="tag">${tag}</span>`
            ).join('');

            document.getElementById('restaurantHero').style.display = 'block';
            lucide.createIcons();
        }

        function processAndDisplayMenu(data) {
            // Process menu data from vendor panel
            // Structure: { itemId: { name, category, price, description, imageURL, ... } }
            allMenuItems = [];
            categories = new Set(['all']);

            if (!data || typeof data !== 'object') {
                showEmptyState();
                return;
            }

            Object.entries(data).forEach(([itemId, item]) => {
                if (item && item.name && item.status === 'available') {
                    const category = item.category || 'Other';
                    categories.add(category);

                    allMenuItems.push({
                        id: itemId,
                        name: item.name,
                        category: category,
                        price: parseFloat(item.price) || 0,
                        description: item.description || '',
                        imageURL: item.imageURL || '',
                        calories: item.calories || '',
                        prepTime: item.prepTime || '',
                        allergens: item.allergens || '',
                        status: item.status || 'available',
                        featured: item.featured || false
                    });
                }
            });

            if (allMenuItems.length === 0) {
                showEmptyState();
                return;
            }

            // Generate category tabs
            const categoryArray = Array.from(categories);
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = categoryArray.map(cat => 
                `<button class="tab-btn ${cat === 'all' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat === 'all' ? 'All Items' : cat}</button>`
            ).join('');
            document.getElementById('categoryTabs').style.display = 'block';

            // Render all items initially
            renderMenuItems(allMenuItems);
        }

        function renderMenuItems(items) {
            const container = document.getElementById('menuContainer');

            // Group by category
            const grouped = items.reduce((acc, item) => {
                const cat = item.category || 'Other';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([category, categoryItems]) => `
                <div class="menu-section">
                    <h3 class="section-title">${category}</h3>
                    <div class="menu-grid">
                        ${categoryItems.map(item => `
                            <div class="menu-card">
                                <div class="menu-card-image-wrap">
                                    <img class="menu-card-image" src="${item.imageURL || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'}" alt="${item.name}" loading="lazy">
                                    ${item.featured ? '<span class="menu-card-badge">⭐ Featured</span>' : ''}
                                </div>
                                <div class="menu-card-content">
                                    <div class="menu-card-header">
                                        <h4 class="menu-card-name">${item.name}</h4>
                                        <span class="menu-card-price">R${item.price.toFixed(2)}</span>
                                    </div>
                                    <p class="menu-card-desc">${item.description || 'No description available'}</p>
                                    <div class="menu-card-meta">
                                        ${item.calories ? `<span><i data-lucide="flame" style="width:12px;height:12px;"></i> ${item.calories} kcal</span>` : ''}
                                        ${item.prepTime ? `<span><i data-lucide="clock" style="width:12px;height:12px;"></i> ${item.prepTime} min</span>` : ''}
                                    </div>
                                    <div class="menu-card-footer">
                                        <button class="add-btn" onclick="addToCart('${item.id}', '${item.name.replace(/'/g, "\'")}', ${item.price}, ${item.prepTime || 0})">
                                            <i data-lucide="plus"></i> Add
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function showEmptyState() {
            document.getElementById('emptyState').classList.add('active');
            document.getElementById('categoryTabs').style.display = 'none';
        }

        window.filterCategory = (category, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;

            if (category === 'all') {
                renderMenuItems(allMenuItems);
            } else {
                const filtered = allMenuItems.filter(item => item.category === category);
                renderMenuItems(filtered);
            }
        };

        window.goBack = () => {
            window.location.href = 'index.html';
        };

        // Calculate average prep time from cart items
        function calculateAveragePrepTime() {
            if (cart.length === 0) return 0;
            const totalPrepTime = cart.reduce((sum, item) => sum + (item.prepTime || 0), 0);
            return Math.ceil(totalPrepTime / cart.length);
        }

        // Get vendor's average prep time from vendor panel
        function getVendorAveragePrepTime() {
            // Check vendor's avgPrepTime field
            if (vendorInfo && vendorInfo.avgPrepTime) {
                return parseInt(vendorInfo.avgPrepTime) || 0;
            }
            // Fallback: calculate from menu items
            if (allMenuItems.length > 0) {
                const times = allMenuItems.map(item => parseInt(item.prepTime) || 0).filter(t => t > 0);
                if (times.length > 0) {
                    return Math.ceil(times.reduce((a, b) => a + b, 0) / times.length);
                }
            }
            return 0;
        }

        window.addToCart = async (itemId, name, price, prepTime = 0) => {
            const existingItem = cart.find(item => item.itemId === itemId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ 
                    itemId, 
                    name, 
                    price, 
                    prepTime: parseInt(prepTime) || 0,
                    quantity: 1,
                    vendorId,
                    addedAt: Date.now()
                });
            }

            // Save to Firebase if user is logged in
            if (currentUserId) {
                await saveCartToFirebase();
            }

            updateCartUI();
            showToast(`Added ${name}`);
        };

        async function saveCartToFirebase() {
            if (!currentUserId) return;
            try {
                await set(ref(db, `carts/${currentUserId}`), {
                    items: cart,
                    vendorId: vendorId,
                    updatedAt: Date.now()
                });
            } catch (error) {
                console.error("Error saving cart:", error);
            }
        }

        async function loadCartFromFirebase() {
            if (!currentUserId) return;
            try {
                const snapshot = await get(ref(db, `carts/${currentUserId}`));
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    // Only load cart if it's for the same vendor
                    if (data.vendorId === vendorId && data.items) {
                        cart = data.items;
                        updateCartUI();
                    }
                }
            } catch (error) {
                console.error("Error loading cart:", error);
            }
        }

        async function updateCartItemQuantity(index, newQuantity) {
            if (newQuantity < 1) {
                cart.splice(index, 1);
            } else {
                cart[index].quantity = newQuantity;
            }

            if (currentUserId) {
                await saveCartToFirebase();
            }
            updateCartUI();
        }

        window.removeFromCart = async (index) => {
            cart.splice(index, 1);
            if (currentUserId) {
                await saveCartToFirebase();
            }
            updateCartUI();
        };

        function updateCartUI() {
            const body = document.getElementById('cartBody');
            const countEl = document.getElementById('cartCount');
            const checkoutBtn = document.getElementById('checkoutBtn');
            const summaryEl = document.getElementById('cartSummary');

            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const deliveryFee = parseFloat(vendorInfo?.deliveryFee || 0);
            const total = subtotal + deliveryFee;

            countEl.textContent = totalItems;
            checkoutBtn.disabled = cart.length === 0;

            // Calculate prep time
            const avgPrepTime = calculateAveragePrepTime();
            const vendorAvgPrep = getVendorAveragePrepTime();
            const displayPrepTime = avgPrepTime > 0 ? avgPrepTime : vendorAvgPrep;

            if (cart.length === 0) {
                body.innerHTML = `<p style="text-align:center;color:var(--dim);margin-top:80px;">Your cart is empty</p>`;
                summaryEl.innerHTML = '';
            } else {
                body.innerHTML = cart.map((item, index) => `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px;background:var(--surface2);border-radius:12px;">
                        <div style="flex:1;">
                            <div style="font-weight:700;">${item.name}</div>
                            <div style="color:var(--dim);font-size:0.85rem;">R${item.price.toFixed(2)} each</div>
                        </div>
                        <div class="quantity-control">
                            <button class="qty-btn" onclick="updateCartItemQuantity(${index}, ${item.quantity - 1})">
                                <i data-lucide="minus" style="width:14px;height:14px;"></i>
                            </button>
                            <span class="qty-value">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateCartItemQuantity(${index}, ${item.quantity + 1})">
                                <i data-lucide="plus" style="width:14px;height:14px;"></i>
                            </button>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none;border:none;color:var(--danger);cursor:pointer;padding:8px;margin-left:8px;">
                            <i data-lucide="trash-2" style="width:18px;height:18px;"></i>
                        </button>
                    </div>
                `).join('');

                // Show prep time badge if available
                const prepTimeHtml = displayPrepTime > 0 
                    ? `<div class="prep-time-badge"><i data-lucide="clock" style="width:14px;height:14px;"></i> Est. prep time: ${displayPrepTime} min</div>` 
                    : '';

                summaryEl.innerHTML = `
                    ${prepTimeHtml}
                    <div class="cart-summary">
                        <div class="cart-summary-row">
                            <span>Subtotal (${totalItems} items)</span>
                            <span>R ${subtotal.toFixed(2)}</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Delivery Fee</span>
                            <span>R ${deliveryFee.toFixed(2)}</span>
                        </div>
                        <div class="cart-summary-row">
                            <span>Total</span>
                            <span style="color:var(--accent);">R ${total.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        window.updateCartItemQuantity = async (index, newQuantity) => {
            await updateCartItemQuantity(index, newQuantity);
        };

        window.toggleCart = () => {
            document.getElementById('cartDrawer').classList.toggle('open');
        };

        window.handleCheckout = async () => {
            if (!currentUser) {
                showToast("Please sign in to checkout");
                return;
            }

            if (cart.length === 0) {
                showToast("Your cart is empty");
                return;
            }

            try {
                // Create order
                const orderData = {
                    userId: currentUserId,
                    vendorId: vendorId,
                    vendorName: vendorInfo?.name || '',
                    items: cart,
                    subtotal: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0),
                    deliveryFee: parseFloat(vendorInfo?.deliveryFee || 0),
                    total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + parseFloat(vendorInfo?.deliveryFee || 0),
                    status: 'pending',
                    createdAt: Date.now(),
                    estimatedPrepTime: calculateAveragePrepTime() || getVendorAveragePrepTime()
                };

                const newOrderRef = push(ref(db, 'orders'));
                await set(newOrderRef, orderData);

                // Clear cart
                cart = [];
                await saveCartToFirebase();
                updateCartUI();
                toggleCart();
                showToast("Order placed successfully!");
            } catch (error) {
                console.error("Checkout error:", error);
                showToast("Failed to place order");
            }
        };

        window.showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        // Auth state
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                currentUserId = user.uid;
                loadCartFromFirebase();
            } else {
                currentUserId = null;
                cart = [];
                updateCartUI();
            }
        });

        // Initialize
        lucide.createIcons();
        loadMenu();
    </script>
</body>
</html>
