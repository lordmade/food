<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#06C167">
    <title>Menu | Vynix Eats</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface2: #f1f3f5;
            --border: #e9ecef;
            --text: #1a1d23;
            --dim: #6c757d;
            --accent: #06C167;
            --accent-dark: #05a357;
            --yellow: #ffc107;
            --danger: #ff3b30;
            --heart: #ff2d55;
            --radius: 20px;
            --radius-sm: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --header-height: 70px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);

            /* Shimmer colors */
            --shimmer-base: #f0f0f0;
            --shimmer-highlight: #e8e8e8;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            touch-action: manipulation;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ============================================
           SHIMMER LOADING EFFECT
           ============================================ */

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .shimmer {
            background: linear-gradient(90deg, 
                var(--shimmer-base) 25%, 
                var(--shimmer-highlight) 50%, 
                var(--shimmer-base) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Shimmer Overlay - Full Page */
        .shimmer-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 5000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .shimmer-overlay.active {
            display: flex;
        }

        /* Shimmer Header */
        .shimmer-header {
            padding: 12px 16px;
            background: var(--surface);
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--header-height);
        }

        .shimmer-back-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .shimmer-title {
            width: 150px;
            height: 24px;
            border-radius: 6px;
        }

        .shimmer-header-actions {
            margin-left: auto;
            display: flex;
            gap: 10px;
        }

        .shimmer-action-btn {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
        }

        /* Shimmer Restaurant Info */
        .shimmer-restaurant-info {
            padding: 20px 16px;
            background: var(--surface);
            margin-bottom: 12px;
        }

        .shimmer-restaurant-image {
            width: 100%;
            height: 200px;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .shimmer-restaurant-name {
            width: 70%;
            height: 28px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .shimmer-restaurant-meta {
            width: 50%;
            height: 18px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        /* Shimmer Category Tabs */
        .shimmer-categories {
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            background: var(--surface);
            margin-bottom: 12px;
        }

        .shimmer-category-btn {
            width: 100px;
            height: 40px;
            border-radius: 100px;
            flex-shrink: 0;
        }

        /* Shimmer Menu Items */
        .shimmer-content {
            padding: 20px 16px;
            flex: 1;
        }

        .shimmer-section-title {
            width: 120px;
            height: 24px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .shimmer-menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Shimmer Menu Item */
        .shimmer-menu-item {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            padding: 16px;
            gap: 16px;
        }

        .shimmer-menu-image {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .shimmer-menu-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .shimmer-menu-title {
            height: 22px;
            width: 80%;
            border-radius: 4px;
        }

        .shimmer-menu-desc {
            height: 16px;
            width: 100%;
            border-radius: 4px;
        }

        .shimmer-menu-desc-short {
            height: 16px;
            width: 60%;
            border-radius: 4px;
        }

        .shimmer-menu-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .shimmer-menu-price {
            height: 20px;
            width: 60px;
            border-radius: 4px;
        }

        .shimmer-menu-btn {
            height: 36px;
            width: 80px;
            border-radius: 100px;
        }

        /* App Container */
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            height: var(--header-height);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .back-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .back-btn:active {
            background: var(--border);
            transform: scale(0.95);
        }

        .back-btn i {
            width: 24px;
            height: 24px;
        }

        .header-title {
            font-weight: 800;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .action-btn {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text);
            position: relative;
            transition: var(--transition);
        }

        .action-btn:active {
            transform: scale(0.95);
            background: var(--border);
        }

        .action-btn i {
            width: 22px;
            height: 22px;
        }

        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 18px;
            text-align: center;
            border: 2px solid var(--surface);
        }

        /* Restaurant Info Section */
        .restaurant-hero {
            background: var(--surface);
            padding: 20px 16px;
            margin-bottom: 12px;
        }

        .restaurant-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        .restaurant-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .restaurant-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--dim);
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .restaurant-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .restaurant-meta i {
            width: 16px;
            height: 16px;
        }

        .rating-star {
            color: var(--yellow);
        }

        .restaurant-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 12px;
            background: var(--surface2);
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dim);
        }

        /* Category Tabs */
        .category-tabs {
            background: var(--surface);
            padding: 12px 0;
            position: sticky;
            top: var(--header-height);
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .tabs-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 16px;
            scroll-padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex: 0 0 auto;
            padding: 10px 20px;
            border-radius: 100px;
            background: var(--surface2);
            border: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--dim);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
            min-height: 40px;
            touch-action: manipulation;
        }

        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tab-btn:active {
            transform: scale(0.96);
        }

        /* Menu Content */
        .menu-content {
            padding: 20px 16px 100px;
            flex: 1;
        }

        .menu-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text);
            text-transform: capitalize;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Menu Item Card */
        .menu-item {
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            padding: 16px;
            gap: 16px;
            transition: var(--transition);
        }

        .menu-item:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-lg);
        }

        .menu-item-image {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
        }

        .menu-item-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .menu-item-name {
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.3;
            flex: 1;
        }

        .menu-item-price {
            font-weight: 800;
            color: var(--accent);
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .menu-item-desc {
            color: var(--dim);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .menu-item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .menu-item-calories {
            font-size: 0.8rem;
            color: var(--dim);
            font-weight: 500;
        }

        .add-btn {
            padding: 8px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 36px;
        }

        .add-btn:active {
            transform: scale(0.95);
            background: var(--accent-dark);
        }

        .add-btn i {
            width: 16px;
            height: 16px;
        }

        /* Empty State */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: var(--dim);
        }

        .empty-state.active {
            display: block;
        }

        .empty-state i {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state p:first-of-type {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        /* Toast */
        #toast {
            position: fixed;
            bottom: calc(24px + var(--safe-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(200px);
            background: var(--text);
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 4000;
            transition: transform 0.3s ease;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            max-width: 90vw;
            text-align: center;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* Cart Drawer */
        .cart-drawer {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            z-index: 2000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }

        .cart-drawer.open {
            transform: translateX(0);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-weight: 800;
            font-size: 1.2rem;
        }

        .close-cart-btn {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface2);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            color: var(--dim);
        }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border);
            background: var(--surface);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 18px;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            min-height: 56px;
        }

        .checkout-btn:active {
            transform: scale(0.98);
            background: var(--accent-dark);
        }

        .checkout-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
        }

        /* Desktop Styles */
        @media (min-width: 768px) {
            :root {
                --header-height: 80px;
            }

            .shimmer-header,
            .header {
                padding: 16px 32px;
            }

            .shimmer-restaurant-info,
            .restaurant-hero {
                padding: 24px 32px;
            }

            .shimmer-categories,
            .category-tabs {
                padding-left: 32px;
                padding-right: 32px;
            }

            .shimmer-content,
            .menu-content {
                padding: 32px;
                padding-bottom: 32px;
            }

            .menu-item {
                padding: 20px;
            }

            .menu-item-image {
                width: 120px;
                height: 120px;
            }

            .cart-drawer {
                width: 400px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>

    <!-- SHIMMER LOADING OVERLAY -->
    <div class="shimmer-overlay" id="shimmerOverlay">
        <!-- Shimmer Header -->
        <div class="shimmer-header">
            <div class="shimmer shimmer-back-btn"></div>
            <div class="shimmer shimmer-title"></div>
            <div class="shimmer-header-actions">
                <div class="shimmer shimmer-action-btn"></div>
                <div class="shimmer shimmer-action-btn"></div>
            </div>
        </div>

        <!-- Shimmer Restaurant Info -->
        <div class="shimmer-restaurant-info">
            <div class="shimmer shimmer-restaurant-image"></div>
            <div class="shimmer shimmer-restaurant-name"></div>
            <div class="shimmer shimmer-restaurant-meta"></div>
            <div class="shimmer shimmer-restaurant-meta" style="width: 30%;"></div>
        </div>

        <!-- Shimmer Category Tabs -->
        <div class="shimmer-categories">
            <div class="shimmer shimmer-category-btn"></div>
            <div class="shimmer shimmer-category-btn"></div>
            <div class="shimmer shimmer-category-btn"></div>
            <div class="shimmer shimmer-category-btn"></div>
        </div>

        <!-- Shimmer Menu Items -->
        <div class="shimmer-content">
            <div class="shimmer shimmer-section-title"></div>
            <div class="shimmer-menu-grid">
                <div class="shimmer-menu-item">
                    <div class="shimmer shimmer-menu-image"></div>
                    <div class="shimmer-menu-content">
                        <div class="shimmer shimmer-menu-title"></div>
                        <div class="shimmer shimmer-menu-desc"></div>
                        <div class="shimmer shimmer-menu-desc-short"></div>
                        <div class="shimmer-menu-footer">
                            <div class="shimmer shimmer-menu-price"></div>
                            <div class="shimmer shimmer-menu-btn"></div>
                        </div>
                    </div>
                </div>
                <div class="shimmer-menu-item">
                    <div class="shimmer shimmer-menu-image"></div>
                    <div class="shimmer-menu-content">
                        <div class="shimmer shimmer-menu-title"></div>
                        <div class="shimmer shimmer-menu-desc"></div>
                        <div class="shimmer shimmer-menu-desc-short"></div>
                        <div class="shimmer-menu-footer">
                            <div class="shimmer shimmer-menu-price"></div>
                            <div class="shimmer shimmer-menu-btn"></div>
                        </div>
                    </div>
                </div>
                <div class="shimmer-menu-item">
                    <div class="shimmer shimmer-menu-image"></div>
                    <div class="shimmer-menu-content">
                        <div class="shimmer shimmer-menu-title"></div>
                        <div class="shimmer shimmer-menu-desc"></div>
                        <div class="shimmer shimmer-menu-desc-short"></div>
                        <div class="shimmer-menu-footer">
                            <div class="shimmer shimmer-menu-price"></div>
                            <div class="shimmer shimmer-menu-btn"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">Message</div>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="back-btn" onclick="goBack()" aria-label="Go back">
                    <i data-lucide="arrow-left"></i>
                </button>
                <h1 class="header-title" id="headerTitle">Menu</h1>
            </div>

            <div class="header-actions">
                <button class="action-btn" onclick="toggleCart()" aria-label="Cart">
                    <i data-lucide="shopping-bag"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </button>
            </div>
        </header>

        <!-- Restaurant Info -->
        <div class="restaurant-hero" id="restaurantHero" style="display: none;">
            <img class="restaurant-image" id="restaurantImage" src="" alt="">
            <h2 class="restaurant-name" id="restaurantName"></h2>
            <div class="restaurant-meta">
                <span><i data-lucide="star" class="rating-star"></i> <span id="restaurantRating"></span></span>
                <span><i data-lucide="clock"></i> <span id="restaurantTime"></span></span>
                <span><i data-lucide="truck"></i> R<span id="restaurantDelivery"></span></span>
            </div>
            <div class="restaurant-tags" id="restaurantTags"></div>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs" style="display: none;">
            <div class="tabs-scroll no-scrollbar" id="tabsContainer">
                <button class="tab-btn active" onclick="filterCategory('all', this)">All Items</button>
            </div>
        </div>

        <!-- Menu Content -->
        <main class="menu-content">
            <div class="empty-state" id="emptyState">
                <i data-lucide="package-open"></i>
                <p>No menu items found.</p>
                <p style="font-size: 0.9rem;">This restaurant hasn't added any items yet.</p>
            </div>

            <div id="menuContainer"></div>
        </main>
    </div>

    <!-- Cart Drawer -->
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-cart-btn" onclick="toggleCart()">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="cart-body" id="cartBody">
            <p style="text-align: center; color: var(--dim); margin-top: 80px;">Your cart is empty</p>
        </div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 1.1rem;">
                <span style="color: var(--dim); font-weight: 600;">Total</span>
                <span id="cartTotal" style="font-weight: 800;">R 0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled onclick="handleCheckout()">Checkout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxBT0oESoL62oz_x_Z8cMtdENWZPx4tMI",
            authDomain: "pinotp-d7ef5.firebaseapp.com",
            databaseURL: "https://pinotp-d7ef5-default-rtdb.firebaseio.com",
            projectId: "pinotp-d7ef5",
            storageBucket: "pinotp-d7ef5.firebasestorage.app",
            messagingSenderId: "708458917827",
            appId: "1:708458917827:web:375de278577df0adcf9776"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // Get vendor ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('vendor');

        if (!vendorId) {
            showToast("No restaurant selected");
            setTimeout(() => window.location.href = 'index.html', 2000);
        }

        let cart = [];
        let currentUser = null;
        let menuData = {};
        let currentCategory = 'all';
        let allMenuItems = [];
        let categories = new Set(['all']);

        // Show/Hide shimmer loading
        function showShimmer() {
            document.getElementById('shimmerOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideShimmer() {
            document.getElementById('shimmerOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Load vendor data and menu from vendor panel structure
        async function loadMenu() {
            showShimmer();

            try {
                // Load vendor info from vendors/{vendorId}
                const vendorSnapshot = await get(ref(db, `vendors/${vendorId}`));
                if (vendorSnapshot.exists()) {
                    const vendor = vendorSnapshot.val();
                    displayVendorInfo(vendor);
                } else {
                    showToast("Restaurant not found");
                    setTimeout(() => window.location.href = 'index.html', 2000);
                    return;
                }

                // Load menu from vendors/{vendorId}/menu (vendor panel structure)
                const menuSnapshot = await get(ref(db, `vendors/${vendorId}/menu`));
                if (menuSnapshot.exists()) {
                    menuData = menuSnapshot.val();
                    processAndDisplayMenu(menuData);
                } else {
                    showEmptyState();
                }
            } catch (error) {
                console.error("Error loading menu:", error);
                showToast("Failed to load menu");
                showEmptyState();
            } finally {
                setTimeout(hideShimmer, 500);
            }
        }

        function displayVendorInfo(vendor) {
            document.getElementById('headerTitle').textContent = vendor.name || 'Menu';
            document.getElementById('restaurantName').textContent = vendor.name || 'Unnamed';
            document.getElementById('restaurantImage').src = vendor.imageURL || 'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=800';
            document.getElementById('restaurantRating').textContent = vendor.rating || '4.5';
            document.getElementById('restaurantTime').textContent = vendor.deliveryTime || '20-35 min';
            document.getElementById('restaurantDelivery').textContent = vendor.deliveryFee || '20';

            // Tags
            const tagsContainer = document.getElementById('restaurantTags');
            const tags = [vendor.cuisineCategory, vendor.cuisine, vendor.storeType].filter(Boolean);
            tagsContainer.innerHTML = tags.map(tag => 
                `<span class="tag">${tag}</span>`
            ).join('');

            document.getElementById('restaurantHero').style.display = 'block';
            lucide.createIcons();
        }

        function processAndDisplayMenu(data) {
            // Process menu data from vendor panel
            // Structure: { itemId: { name, category, price, description, imageURL, ... } }
            allMenuItems = [];
            categories = new Set(['all']);

            if (!data || typeof data !== 'object') {
                showEmptyState();
                return;
            }

            Object.entries(data).forEach(([itemId, item]) => {
                if (item && item.name) {
                    const category = item.category || 'Other';
                    categories.add(category);

                    allMenuItems.push({
                        id: itemId,
                        name: item.name,
                        category: category,
                        price: parseFloat(item.price) || 0,
                        description: item.description || '',
                        imageURL: item.imageURL || '',
                        calories: item.calories || '',
                        prepTime: item.prepTime || '',
                        allergens: item.allergens || '',
                        status: item.status || 'available',
                        featured: item.featured || false
                    });
                }
            });

            if (allMenuItems.length === 0) {
                showEmptyState();
                return;
            }

            // Generate category tabs
            const categoryArray = Array.from(categories);
            const tabsContainer = document.getElementById('tabsContainer');
            tabsContainer.innerHTML = categoryArray.map(cat => 
                `<button class="tab-btn ${cat === 'all' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat === 'all' ? 'All Items' : cat}</button>`
            ).join('');
            document.getElementById('categoryTabs').style.display = 'block';

            // Render all items initially
            renderMenuItems(allMenuItems);
        }

        function renderMenuItems(items) {
            const container = document.getElementById('menuContainer');

            // Group by category
            const grouped = items.reduce((acc, item) => {
                const cat = item.category || 'Other';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            container.innerHTML = Object.entries(grouped).map(([category, categoryItems]) => `
                <div class="menu-section">
                    <h3 class="section-title">${category}</h3>
                    <div class="menu-items">
                        ${categoryItems.map(item => `
                            <div class="menu-item" onclick="addToCart('${item.id}', '${item.name.replace(/'/g, "\'")}', ${item.price})">
                                <img class="menu-item-image" src="${item.imageURL || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'}" alt="${item.name}" loading="lazy">
                                <div class="menu-item-content">
                                    <div class="menu-item-header">
                                        <h4 class="menu-item-name">${item.name}</h4>
                                        <span class="menu-item-price">R${item.price.toFixed(2)}</span>
                                    </div>
                                    <p class="menu-item-desc">${item.description || 'No description available'}</p>
                                    <div class="menu-item-footer">
                                        <span class="menu-item-calories">${item.calories ? item.calories + ' kcal' : ''} ${item.prepTime ? '• ' + item.prepTime + ' min' : ''}</span>
                                        <button class="add-btn" onclick="event.stopPropagation(); addToCart('${item.id}', '${item.name.replace(/'/g, "\'")}', ${item.price})">
                                            <i data-lucide="plus"></i> Add
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function showEmptyState() {
            document.getElementById('emptyState').classList.add('active');
            document.getElementById('categoryTabs').style.display = 'none';
        }

        window.filterCategory = (category, btn) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = category;

            if (category === 'all') {
                renderMenuItems(allMenuItems);
            } else {
                const filtered = allMenuItems.filter(item => item.category === category);
                renderMenuItems(filtered);
            }
        };

        window.goBack = () => {
            window.location.href = 'index.html';
        };

        window.addToCart = (itemId, name, price) => {
            cart.push({ itemId, name, price, vendorId });
            updateCartUI();
            showToast(`Added ${name}`);
        };

        function updateCartUI() {
            const body = document.getElementById('cartBody');
            const countEl = document.getElementById('cartCount');
            const totalEl = document.getElementById('cartTotal');
            const checkoutBtn = document.getElementById('checkoutBtn');

            countEl.textContent = cart.length;
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            totalEl.textContent = `R ${total.toFixed(2)}`;
            checkoutBtn.disabled = cart.length === 0;

            if (cart.length === 0) {
                body.innerHTML = `<p style="text-align:center;color:var(--dim);margin-top:80px;">Your cart is empty</p>`;
            } else {
                body.innerHTML = cart.map((item, index) => `
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:12px;background:var(--surface2);border-radius:12px;">
                        <div>
                            <div style="font-weight:700;">${item.name}</div>
                            <div style="color:var(--dim);font-size:0.85rem;">R${item.price.toFixed(2)}</div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none;border:none;color:var(--danger);cursor:pointer;padding:8px;">
                            <i data-lucide="trash-2" style="width:18px;height:18px;"></i>
                        </button>
                    </div>
                `).join('');
                lucide.createIcons();
            }
        }

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            updateCartUI();
        };

        window.toggleCart = () => {
            document.getElementById('cartDrawer').classList.toggle('open');
        };

        window.handleCheckout = () => {
            if (!currentUser) {
                showToast("Please sign in to checkout");
            } else {
                showToast("Processing checkout...");
            }
        };

        window.showToast = (msg) => {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };

        // Auth state
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
        });

        // Initialize
        lucide.createIcons();
        loadMenu();
    </script>
</body>
</html>
